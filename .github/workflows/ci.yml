name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: fmotion
          POSTGRES_PASSWORD: fmotion
          POSTGRES_DB: fmotion
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fmotion"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://fmotion:fmotion@127.0.0.1:5432/fmotion
      TEST_S3_ENDPOINT: http://127.0.0.1:9000
      RUN_MEDIA_INTEGRATION: "1"
      RUN_QUEUE_INTEGRATION: "1"
      RUN_PROJECT_INTEGRATION: "1"
      RUN_RENDER_INTEGRATION: "1"
      RUN_WORKER_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"
      - run: docker run -d --name minio -e MINIO_ROOT_USER=fmotion -e MINIO_ROOT_PASSWORD=fmotion-local-secret -p 9000:9000 minio/minio:latest server /data
      - run: |
          until curl --fail --silent http://127.0.0.1:9000/minio/health/live; do sleep 1; done
          docker run --rm --network container:minio minio/mc alias set local http://127.0.0.1:9000 fmotion fmotion-local-secret
          docker run --rm --network container:minio minio/mc mb --ignore-existing local/fmotion-local
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:web
      - run: npx prisma validate
      - run: flutter analyze apps/mobile
      - run: cd apps/mobile && flutter test
      - run: cd apps/mobile && flutter build apk --debug
