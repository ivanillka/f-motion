name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: fengine
          POSTGRES_PASSWORD: fengine
          POSTGRES_DB: fengine
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fengine"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://fengine:fengine@127.0.0.1:5432/fengine
      TEST_DATABASE_URL: postgresql://fengine:fengine@127.0.0.1:5432/fengine
      TEST_S3_ENDPOINT: http://127.0.0.1:9000
      RUN_MEDIA_INTEGRATION: "1"
      RUN_FAL_INTEGRATION: "1"
      RUN_QUEUE_INTEGRATION: "1"
      RUN_PROJECT_INTEGRATION: "1"
      RUN_RENDER_INTEGRATION: "1"
      RUN_WORKER_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # First-party install: marketplace flutter-action failed DNS on GitHub's internal action API.
      - run: |
          git clone --depth 1 --branch 3.44.8 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - run: |
          sdk="$RUNNER_TEMP/android-sdk"
          mkdir -p "$sdk/cmdline-tools"
          curl -fsSL -o /tmp/android-cmd.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/android-cmd.zip -d /tmp/android-cmd
          mv /tmp/android-cmd/cmdline-tools "$sdk/cmdline-tools/latest"
          mkdir -p "$sdk/licenses"
          printf '24333f8a63b6825ea9c5514f83c2829b004d1fee\n' > "$sdk/licenses/android-sdk-license"
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"
          echo "$sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$sdk/platform-tools" >> "$GITHUB_PATH"
      - run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"
      - run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
      - run: docker run -d --name minio -e MINIO_ROOT_USER=fengine -e MINIO_ROOT_PASSWORD=fengine-local-secret -p 9000:9000 minio/minio:latest server /data
      - run: |
          until curl --fail --silent http://127.0.0.1:9000/minio/health/live; do sleep 1; done
          docker run --rm --network container:minio \
            -e MC_HOST_local=http://fengine:fengine-local-secret@127.0.0.1:9000 \
            minio/mc mb --ignore-existing local/fengine-local
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run verify:pages-artifact
      - run: npm run test:package-consumer
      - run: node --test tools/publication/*.test.mjs
      - run: git ls-files -z | node tools/publication/check.mjs --inventory0
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:web
      - run: npx prisma validate
      - run: cd apps/mobile && flutter pub get
      - run: flutter analyze apps/mobile
      - run: cd apps/mobile && flutter test
      - run: cd apps/mobile && flutter build apk --debug
