name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    name: check
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://fengine:fengine@127.0.0.1:5432/fengine
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-ffmpeg
      - run: npm run lint

  test:
    name: test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: fengine
          POSTGRES_PASSWORD: fengine
          POSTGRES_DB: fengine
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fengine"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://fengine:fengine@127.0.0.1:5432/fengine
      TEST_DATABASE_URL: postgresql://fengine:fengine@127.0.0.1:5432/fengine
      TEST_S3_ENDPOINT: http://127.0.0.1:9000
      RUN_MEDIA_INTEGRATION: "1"
      RUN_FAL_INTEGRATION: "1"
      RUN_QUEUE_INTEGRATION: "1"
      RUN_PROJECT_INTEGRATION: "1"
      RUN_RENDER_INTEGRATION: "1"
      RUN_WORKER_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-ffmpeg
      # ponytail: MinIO Docker Hub and Quay anonymous pulls died (2026-09). Ceiling: pin digests if Chainguard tags churn CI.
      - run: docker run -d --name minio -e MINIO_ROOT_USER=fengine -e MINIO_ROOT_PASSWORD=fengine-local-secret -p 9000:9000 cgr.dev/chainguard/minio:latest server /data
      - run: |
          until curl --fail --silent http://127.0.0.1:9000/minio/health/live; do sleep 1; done
          docker run --rm --network container:minio \
            -e MC_HOST_local=http://fengine:fengine-local-secret@127.0.0.1:9000 \
            cgr.dev/chainguard/minio-client:latest mb --ignore-existing local/fengine-local
      - run: npx prisma migrate deploy
      - run: npx prisma validate
      - run: npm test
      - run: npm run build
      - run: npm run smoke:reel
      - run: npm run verify:pages-artifact
      - run: npm run test:package-consumer
      - run: node --test tools/publication/*.test.mjs
      - run: git ls-files -z | node tools/publication/check.mjs --inventory0

  e2e:
    name: e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql://fengine:fengine@127.0.0.1:5432/fengine
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-ffmpeg
        with:
          ffmpeg: "true"
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:web

  mobile:
    name: mobile
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true
      - uses: android-actions/setup-android@v4
        with:
          packages: ""
      - run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"
      - run: cd apps/mobile && flutter pub get
      - run: flutter analyze apps/mobile
      - run: cd apps/mobile && flutter test
      - run: cd apps/mobile && flutter build apk --debug

  verify:
    name: verify
    if: always()
    needs: [check, test, e2e, mobile]
    runs-on: ubuntu-24.04
    steps:
      - name: Every required job passed
        env:
          CHECK: ${{ needs.check.result }}
          TEST: ${{ needs.test.result }}
          E2E: ${{ needs.e2e.result }}
          MOBILE: ${{ needs.mobile.result }}
        run: |
          echo "check=$CHECK test=$TEST e2e=$E2E mobile=$MOBILE"
          test "$CHECK" = success
          test "$TEST" = success
          test "$E2E" = success
          test "$MOBILE" = success
