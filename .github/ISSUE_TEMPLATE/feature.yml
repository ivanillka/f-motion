name: Feature request
description: A product or docs change that stays honest about what F-Motion does
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard or missing today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Smallest change that would help. Do not assume MCP, paid credit packs, or 4K/60.
    validations:
      required: true
