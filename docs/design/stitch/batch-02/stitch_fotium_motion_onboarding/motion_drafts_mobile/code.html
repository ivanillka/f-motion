<!-- Backdrop for Filter Sheet -->
<div class="fixed inset-0 bg-black/60 z-[55] hidden opacity-0 transition-opacity duration-300" id="filter-backdrop" onclick="document.getElementById('filter-sheet').classList.add('translate-y-full')"></div>
<script>
        // Simple logic to handle filter sheet backdrop
        const filterSheet = document.getElementById('filter-sheet');
        const filterBackdrop = document.getElementById('filter-backdrop');
        
        // Observer to watch class changes on the sheet to toggle backdrop
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.attributeName === "class") {
                    const isHidden = filterSheet.classList.contains('translate-y-full');
                    if (!isHidden) {
                        filterBackdrop.classList.remove('hidden');
                        // Small delay to allow display:block to apply before animating opacity
                        setTimeout(() => filterBackdrop.classList.remove('opacity-0'), 10);
                    } else {
                        filterBackdrop.classList.add('opacity-0');
                        setTimeout(() => filterBackdrop.classList.add('hidden'), 300); // match transition duration
                    }
                }
            });
        });
        
        observer.observe(filterSheet, { attributes: true });
    </script>
