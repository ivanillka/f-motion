<body class="bg-background text-on-surface antialiased h-screen w-screen overflow-hidden flex flex-col relative">
<!-- Scrim (Simulated Background) -->
<div class="absolute inset-0 bg-black/60 backdrop-blur-sm z-40"></div>
<!-- Bottom Sheet -->
<div class="absolute bottom-0 w-full bg-surface-container-high rounded-t-3xl z-50 flex flex-col transform transition-transform duration-300 shadow-[0_-8px_30px_rgba(0,0,0,0.5)]">
<!-- Drag Handle -->
<div class="w-full pt-4 pb-2 flex justify-center items-center cursor-grab active:cursor-grabbing">
<div class="drag-handle"></div>
</div>
<!-- Header: Thumbnail & Info -->
<div class="px-margin-mobile py-stack-sm flex items-center gap-stack-md border-b border-surface-variant">
<!-- Thumbnail -->
<div class="relative w-24 h-16 rounded-lg overflow-hidden shrink-0 border border-outline-variant/30">
<img class="w-full h-full object-cover" data-alt="A moody, cinematic thumbnail showing a futuristic cityscape at night with neon lights reflecting in puddles, rendered in a sleek, high-contrast digital art style fitting a premium video editing application's dark theme." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCg732HEwFE6W7ecW8y0Uq51hdTWdz-r4msqKXSPxcffX_3ZOgCiVQgmlN7uN_swOVVS7uOvCegzrLEreXu1Fk-lE8XQJJ1WadLPMgp0sOcu_3hNjAR92iRs9PTeMsE8j1W5A9mWUARGyYSty0JINyiFvcbnLFiyxopoq-Kom_Db36e05NExlIdwAZod7oajy9XfmQ8OgzAAra83SLeSkgibR5u9zSD8POjnm6N2FytJdExaQATQ_4z_DB35zS-recduRtF7jIGC6Q"/>
<!-- Duration Badge -->
<div class="absolute bottom-1 right-1 bg-surface-container-lowest/80 backdrop-blur-md px-1.5 py-0.5 rounded text-on-surface font-label-sm text-label-sm">
                    02:14
                </div>
</div>
<!-- Metadata -->
<div class="flex-1 min-w-0">
<h2 class="font-headline-sm text-headline-sm text-on-surface truncate">Project_Neon_Sky_v2</h2>
<div class="flex items-center gap-2 mt-1">
<span class="bg-surface-container-lowest px-2 py-0.5 rounded font-label-sm text-label-sm text-on-surface-variant border border-surface-variant">4K 60FPS</span>
<span class="font-body-md text-body-md text-on-surface-variant">·</span>
<span class="font-body-md text-body-md text-on-surface-variant">Edited Oct 24, 2023</span>
</div>
</div>
</div>
<!-- Primary Action -->
<div class="px-margin-mobile py-stack-md">
<button class="w-full bg-primary-container hover:bg-primary-fixed active:scale-[0.98] transition-all text-on-primary-container font-headline-sm text-headline-sm py-4 rounded-xl flex items-center justify-center gap-2 shadow-[0_0_15px_rgba(0,240,255,0.1)]">
<span class="material-symbols-outlined" data-icon="edit" data-weight="fill">edit</span>
                Continue editing
            </button>
</div>
<!-- List Actions -->
<div class="flex flex-col pb-margin-mobile">
<button class="flex items-center gap-4 px-margin-mobile py-4 hover:bg-surface-container-highest transition-colors w-full text-left active:bg-surface-bright">
<span class="material-symbols-outlined text-on-surface-variant" data-icon="edit_note">edit_note</span>
<span class="font-body-lg text-body-lg text-on-surface flex-1">Rename</span>
</button>
<button class="flex items-center gap-4 px-margin-mobile py-4 hover:bg-surface-container-highest transition-colors w-full text-left active:bg-surface-bright">
<span class="material-symbols-outlined text-on-surface-variant" data-icon="content_copy">content_copy</span>
<span class="font-body-lg text-body-lg text-on-surface flex-1">Duplicate</span>
</button>
<div class="h-px w-full bg-surface-variant my-2"></div>
<button class="flex items-center gap-4 px-margin-mobile py-4 hover:bg-error-container/20 transition-colors w-full text-left group active:bg-error-container/30">
<span class="material-symbols-outlined text-error group-hover:text-error" data-icon="delete">delete</span>
<span class="font-body-lg text-body-lg text-error flex-1">Move to trash</span>
</button>
