<body class="bg-background text-on-surface h-screen overflow-hidden flex">
<!-- TopAppBar (Web) -->
<header class="hidden md:flex justify-between items-center w-full px-margin-desktop h-16 bg-background fixed top-0 z-50">
<div class="flex items-center gap-gutter">
<h1 class="font-headline-md text-headline-md font-black text-on-surface tracking-tight">Fotium Motion</h1>
</div>
<div class="flex-1 flex justify-end">
<!-- Search bar right aligned per JSON, but empty state usually implies clean UI. Keeping minimal. -->
</div>
<div class="flex items-center gap-gutter ml-gutter">
<button class="text-on-surface-variant hover:text-primary transition-all duration-200">
<span class="material-symbols-outlined">notifications</span>
</button>
<button class="text-on-surface-variant hover:text-primary transition-all duration-200">
<span class="material-symbols-outlined">help_outline</span>
</button>
<img alt="User avatar" class="w-8 h-8 rounded-full border border-outline-variant object-cover" data-alt="A small circular avatar image for a user profile in a professional dark-mode video editing suite context. Clean, sharp, minimalist aesthetic." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBvl3liiMncz_pP5a4lO1HG2KHIUos1hEhDi9ewVarj0zjTXuEwRaW_i-XYTtMUvAnIHi6h3Ijd4Evl4sv2j5ARrlOKentxYHf4XnWQDAZOgGOmQzPuJoKxQovfPej6FNw8TJJq96ium_DbERMl9h5LtxVQ4m_nY5OmzKrRm0tBZqMaaTQqJ1Kim5a_ixpiI3C8boAiP-_luz8R_r48GYFEo0zDNWYUipOd7QqjvmjUo3SszXCqOABVkRAoh94iruFbPxh2cZsHYQU"/>
</div>
</header>
<!-- SideNavBar (Desktop) -->
<nav class="hidden md:flex flex-col h-full py-margin-desktop bg-surface-container-low dark:bg-surface-container-low h-screen w-[280px] fixed left-0 top-0 border-r border-outline-variant dark:border-outline-variant mt-16 z-40 pt-gutter">
<div class="px-margin-desktop mb-stack-lg flex items-center gap-unit">
<!-- Brand handled in top bar, keeping side nav clean or showing context -->
<div class="w-8 h-8 rounded-lg bg-surface-container-high flex items-center justify-center border border-outline-variant">
<span class="material-symbols-outlined text-primary text-[18px]">movie</span>
</div>
<div>
<div class="font-label-md text-label-md text-on-surface font-bold uppercase tracking-wider">Studio</div>
<div class="font-label-sm text-label-sm text-on-surface-variant">Workspace</div>
</div>
</div>
<ul class="flex flex-col gap-unit px-panel-padding flex-1">
<li>
<a class="flex items-center gap-gutter px-panel-padding py-2 rounded-DEFAULT text-on-surface-variant hover:bg-surface-container-high transition-colors active:scale-95 duration-150" href="#">
<span class="material-symbols-outlined text-[20px]">home</span>
<span class="font-label-md text-label-md">Home</span>
</a>
</li>
<li>
<a class="flex items-center gap-gutter px-panel-padding py-2 rounded-DEFAULT text-on-surface-variant hover:bg-surface-container-high transition-colors active:scale-95 duration-150" href="#">
<span class="material-symbols-outlined text-[20px]">add_circle</span>
<span class="font-label-md text-label-md">Create</span>
</a>
</li>
<li>
<a class="flex items-center gap-gutter px-panel-padding py-2 rounded-DEFAULT text-primary font-bold border-r-2 border-primary bg-surface-container-high/50 hover:bg-surface-container-high transition-colors active:scale-95 duration-150" href="#">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">drafts</span>
<span class="font-label-md text-label-md">Drafts</span>
</a>
</li>
<li class="mt-auto">
<a class="flex items-center gap-gutter px-panel-padding py-2 rounded-DEFAULT text-on-surface-variant hover:bg-surface-container-high transition-colors active:scale-95 duration-150" href="#">
<span class="material-symbols-outlined text-[20px]">settings</span>
<span class="font-label-md text-label-md">Settings</span>
</a>
</li>
</ul>
<div class="px-panel-padding mt-stack-md">
<button class="w-full flex items-center justify-center gap-unit bg-primary-container text-[#000000] font-label-md text-label-md py-2 rounded-DEFAULT hover:bg-primary transition-colors font-bold">
<span class="material-symbols-outlined text-[16px]">add</span>
                Create New
            </button>
</div>
</nav>
<!-- BottomNavBar (Mobile) -->
<nav class="md:hidden fixed bottom-0 w-full z-50 flex justify-around items-center px-4 py-2 bg-surface-container dark:bg-surface-container border-t border-outline-variant shadow-lg docked full-width rounded-t-full">

<span class="font-label-sm-mobile text-label-sm-mobile mt-1">Create</span>

<span class="font-label-sm-mobile text-label-sm-mobile mt-1">Settings</span>
</a>

<!-- Main Content Canvas -->
<main class="flex-1 md:ml-[280px] md:mt-16 relative overflow-hidden flex items-center justify-center bg-background p-margin-desktop md:p-stack-lg">
<!-- Subtle Background Glow -->
<div class="absolute inset-0 flex items-center justify-center pointer-events-none opacity-20">
<div class="w-[600px] h-[600px] bg-primary rounded-full blur-[120px] mix-blend-screen opacity-10"></div>
</div>
<!-- Empty State Container -->
<div class="relative z-10 flex flex-col items-center justify-center max-w-md w-full text-center p-stack-lg rounded-xl border border-surface-container-high/50 bg-surface-container-low/30 backdrop-blur-sm">
<!-- Graphic/Icon -->
<div class="w-24 h-24 mb-stack-md flex items-center justify-center rounded-full bg-surface-container-high border border-outline-variant/30 relative">
<span class="material-symbols-outlined text-on-surface-variant text-[48px] opacity-50">drafts</span>
<!-- Decorative orbital elements to make it feel like a pro tool -->
<div class="absolute w-32 h-32 border border-primary/20 rounded-full animate-[spin_10s_linear_infinite] pointer-events-none"></div>
<div class="absolute w-32 h-32 border border-primary/10 rounded-full animate-[spin_15s_linear_infinite_reverse] pointer-events-none" style="border-style: dashed;"></div>
</div>
<!-- Typography -->
<h2 class="font-headline-md md:text-headline-md font-body-lg text-body-lg md:font-headline-md md:text-headline-md text-on-surface font-semibold mb-unit">No drafts yet</h2>
<p class="font-body-md text-body-md text-on-surface-variant mb-stack-lg">Projects autosave here.</p>
<!-- Primary Action -->
<button class="group relative px-6 py-3 bg-primary-container text-[#000000] font-label-md text-label-md rounded-DEFAULT font-bold overflow-hidden transition-all hover:bg-primary active:scale-95 flex items-center gap-unit">
<span class="relative z-10 flex items-center gap-2">
<span class="material-symbols-outlined text-[18px]">movie_edit</span>
                    Start creating
                </span>
<!-- Hover subtle highlight -->
<div class="absolute inset-0 h-full w-full bg-white/20 translate-y-full group-hover:translate-y-0 transition-transform duration-300 ease-out"></div>
</button>
<!-- Secondary micro-copy -->
<div class="mt-stack-md font-label-sm text-label-sm text-on-surface-variant/50 flex items-center gap-1 uppercase tracking-widest">
<span class="material-symbols-outlined text-[12px]">cloud_done</span>
                 Autosave enabled
             </div>
</div>
<!-- Decorational Grid Background -->
<div class="absolute inset-0 pointer-events-none z-0 opacity-[0.03]" style="background-image: radial-gradient(circle at 2px 2px, white 1px, transparent 0); background-size: 32px 32px;"></div>
</main>
