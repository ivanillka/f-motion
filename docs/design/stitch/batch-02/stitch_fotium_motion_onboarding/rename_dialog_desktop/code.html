<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&amp;family=Geist:wght@400;600;700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
</head>
<body class="bg-background text-on-surface h-screen w-full overflow-hidden flex items-center justify-center font-body-md antialiased">
<!-- Background Context (Blurred out studio) -->
<div class="absolute inset-0 w-full h-full opacity-30 blur-sm pointer-events-none" data-alt="A dark, professional video editing interface in a modern digital workspace. Features multiple panels, a timeline at the bottom, and a large preview window in the center showing a vibrant cityscape. The UI relies on a sophisticated palette of deep blacks and pristine whites, punctuated by intense accents of cyan and violet. The mood is highly technical and precise, reflecting advanced AI-assisted creation." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuCEiLpo0-AJ5h-ARH7gWyghXjVN-qJRNRsVRh4LVNN2SzxFxIPsILFubUEg8yv3wc4wUw0vfKwwlN1UFA9ArhMeccUmxIpDPw2LPtxiY6PjRET3bWYn79rjtoSvlE3eBBUZphsrSzRVA5dwjGHGy8kK2bMpwWXCcEJli72rrutjH4_-WF_hkMq_Dod3i87UNylwvrTOAlq8vFMGjmmpnfQxVysyQyBB_Obn6i_zwm7CmTCg-R58smM3TFn4ddbrmvyHtAJRETMpD9o')"></div>
<div class="absolute inset-0 bg-background/60 pointer-events-none"></div>
<!-- Success Toast Notification (Background) -->
<div class="absolute top-margin-desktop right-margin-desktop z-40 animate-fade-in-down pointer-events-none">
<div class="bg-surface-container-high border border-outline-variant rounded-lg p-panel-padding shadow-lg flex items-center gap-stack-sm min-w-[300px]">
<span class="material-symbols-outlined text-primary-container" style="font-variation-settings: 'FILL' 1;">check_circle</span>
<div class="flex flex-col">
<span class="font-label-md text-label-md text-on-surface">Auto-save completed</span>
<span class="font-body-md text-body-md text-on-surface-variant text-[11px]">Last saved 2 mins ago</span>
</div>
</div>
</div>
<!-- Rename Project Dialog Container -->
<div class="relative z-50 bg-surface-container border border-white/10 rounded-xl shadow-2xl w-full max-w-md flex flex-col overflow-hidden animate-scale-in">
<!-- Dialog Header -->
<div class="px-margin-desktop py-stack-md border-b border-outline-variant/30 flex justify-between items-center bg-surface-container-low">
<h2 class="font-headline-sm text-headline-sm text-on-surface m-0">Rename Project</h2>
<button class="text-on-surface-variant hover:text-on-surface transition-colors focus:outline-none focus:ring-1 focus:ring-primary-container rounded-DEFAULT">
<span class="material-symbols-outlined text-[20px]">close</span>
</button>
</div>
<!-- Dialog Body -->
<div class="p-margin-desktop flex flex-col gap-stack-md">
<div class="flex flex-col gap-stack-sm relative">
<label class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider" for="projectName">Project Name</label>
<div class="relative group">
<input aria-describedby="projectName-error" aria-invalid="true" class="w-full bg-[#121212] border-b-2 border-error text-on-surface font-label-md text-label-md px-panel-padding py-3 focus:outline-none focus:ring-0 focus:border-error transition-colors rounded-t-DEFAULT placeholder-on-surface-variant/50" id="projectName" placeholder="Enter project name..." type="text" value="Urban Cyberpunk Cityscape Vol"/>
<!-- Character Count (Over limit state) -->
<div class="absolute right-3 top-1/2 -translate-y-1/2 flex items-center pointer-events-none">
<span class="font-label-sm text-label-sm text-error font-bold">32/30</span>
</div>
</div>
<!-- Validation Error Message -->
<div class="flex items-start gap-1 mt-1" id="projectName-error">
<span class="material-symbols-outlined text-[14px] text-error">error</span>
<span class="font-body-md text-body-md text-error text-[12px] leading-tight">Project name exceeds the maximum length of 30 characters.</span>
</div>
</div>
<!-- Optional: Description Field -->
<div class="flex flex-col gap-stack-sm mt-stack-sm">
<label class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider" for="projectDesc">Description (Optional)</label>
<textarea class="w-full bg-[#121212] border-b border-outline-variant text-on-surface font-body-md text-body-md px-panel-padding py-3 focus:outline-none focus:ring-0 focus:border-primary-container transition-colors rounded-t-DEFAULT placeholder-on-surface-variant/50 resize-none" id="projectDesc" placeholder="Brief details about this sequence..." rows="2">Neon lighting test renders.</textarea>
</div>
</div>
<!-- Dialog Footer (Actions) -->
<div class="px-margin-desktop py-stack-md bg-surface-container-low border-t border-outline-variant/30 flex justify-end gap-stack-sm">
<button class="px-6 py-2 rounded-DEFAULT font-label-md text-label-md text-on-surface bg-transparent hover:bg-surface-bright transition-colors focus:outline-none focus:ring-1 focus:ring-primary-container">
                Cancel
            </button>
<button class="px-6 py-2 rounded-DEFAULT font-label-md text-label-md text-background bg-primary-container hover:bg-primary-fixed-dim transition-colors opacity-50 cursor-not-allowed flex items-center gap-2" disabled="">
<span class="material-symbols-outlined text-[16px]">save</span>
                Save Changes
            </button>
</div>
</div>
<style>
        /* Custom Keyframes for Animations */
        @keyframes scale-in {
            0% { transform: scale(0.95); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        @keyframes fade-in-down {
            0% { transform: translateY(-10px); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }
        
        .animate-scale-in {
            animation: scale-in 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .animate-fade-in-down {
            animation: fade-in-down 0.3s ease-out forwards;
        }

        /* Hide scrollbar for textarea if it ever gets long */
        textarea::-webkit-scrollbar {
            display: none;
        }
        textarea {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</body></html>
