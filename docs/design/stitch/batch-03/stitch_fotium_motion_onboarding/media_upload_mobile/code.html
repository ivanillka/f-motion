<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Media Upload - Fotium Motion</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "secondary": "#dcb8ff",
                        "on-surface": "#e5e2e1",
                        "surface-container-high": "#2a2a2a",
                        "outline-variant": "#3b494b",
                        "on-secondary-fixed-variant": "#6700b5",
                        "on-primary": "#00363a",
                        "on-error-container": "#ffdad6",
                        "primary-container": "#00f0ff",
                        "on-primary-container": "#006970",
                        "inverse-primary": "#006970",
                        "secondary-container": "#7701d0",
                        "primary-fixed-dim": "#00dbe9",
                        "surface-container-low": "#1c1b1b",
                        "on-secondary": "#480081",
                        "surface": "#131313",
                        "secondary-fixed-dim": "#dcb8ff",
                        "secondary-fixed": "#efdbff",
                        "on-surface-variant": "#b9cacb",
                        "on-tertiary-fixed-variant": "#8f0041",
                        "on-primary-fixed-variant": "#004f54",
                        "surface-container-highest": "#353534",
                        "tertiary-fixed": "#ffd9e0",
                        "surface-container-lowest": "#0e0e0e",
                        "surface-variant": "#353534",
                        "inverse-surface": "#e5e2e1",
                        "surface-container": "#201f1f",
                        "error": "#ffb4ab",
                        "primary-fixed": "#7df4ff",
                        "inverse-on-surface": "#313030",
                        "on-tertiary": "#66002c",
                        "surface-tint": "#00dbe9",
                        "outline": "#849495",
                        "on-secondary-fixed": "#2c0051",
                        "on-background": "#e5e2e1",
                        "tertiary-fixed-dim": "#ffb1c3",
                        "error-container": "#93000a",
                        "surface-bright": "#393939",
                        "on-primary-fixed": "#002022",
                        "surface-dim": "#131313",
                        "tertiary-container": "#ffccd6",
                        "on-tertiary-fixed": "#3f0019",
                        "tertiary": "#fff3f4",
                        "on-tertiary-container": "#bb0058",
                        "primary": "#dbfcff",
                        "on-secondary-container": "#dcb7ff",
                        "background": "#131313",
                        "on-error": "#690005"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "panel-padding": "12px",
                        "gutter": "16px",
                        "margin-desktop": "24px",
                        "unit": "4px",
                        "margin-mobile": "16px",
                        "stack-sm": "8px",
                        "stack-md": "16px",
                        "stack-lg": "32px"
                    },
                    "fontFamily": {
                        "headline-sm": ["Geist"],
                        "headline-md": ["Geist"],
                        "body-lg": ["Inter"],
                        "label-sm": ["JetBrains Mono"],
                        "headline-md-mobile": ["Geist"],
                        "body-md": ["Inter"],
                        "display-lg": ["Geist"],
                        "label-md": ["JetBrains Mono"]
                    },
                    "fontSize": {
                        "headline-sm": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "label-sm": ["10px", { "lineHeight": "14px", "fontWeight": "500" }],
                        "headline-md-mobile": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "display-lg": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "label-md": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "500" }]
                    }
                }
            }
        }
    </script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;600;700&amp;family=Inter:wght@400;500&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-surface font-body-md h-screen flex flex-col overflow-hidden">
<!-- TopAppBar -->
<header class="bg-background flex justify-between items-center w-full px-margin-mobile h-16 border-b border-outline-variant/30 flex-shrink-0 z-10">
<div class="flex items-center gap-2 text-primary-container">
<span class="material-symbols-outlined animate-spin" style="font-variation-settings: 'FILL' 0;">sync</span>
<span class="font-label-md text-label-md">Saving...</span>
</div>
<div class="flex items-center gap-gutter">
<button aria-label="Cancel" class="text-on-surface-variant hover:text-primary transition-all duration-200">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">close</span>
</button>
</div>
</header>
<!-- Chat/Upload Area -->
<main class="flex-1 overflow-y-auto p-margin-mobile flex flex-col gap-stack-lg">
<!-- System Message: Upload Started -->
<div class="flex flex-col gap-stack-sm items-center my-stack-md">
<span class="font-label-sm text-label-sm text-on-surface-variant px-3 py-1 bg-surface-container-low rounded-full border border-outline-variant/30">
                12:45 PM - Upload Session Initiated
            </span>
</div>
<!-- Successful Upload Item -->
<div class="flex gap-3 justify-end w-full">
<div class="max-w-[80%]">
<div class="bg-surface-container-high rounded-xl p-panel-padding border border-outline-variant/20 shadow-lg flex flex-col gap-2">
<div class="flex items-center justify-between mb-1">
<span class="font-label-sm text-label-sm text-primary-container">Uploaded</span>
<span class="material-symbols-outlined text-primary-container text-[16px]" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
<div class="relative w-full aspect-video rounded bg-surface-container-lowest overflow-hidden border border-outline-variant/30">
<img alt="Uploaded image thumbnail" class="object-cover w-full h-full opacity-80" data-alt="A dark, cinematic macro shot of a sleek, metallic camera lens reflecting a cyan neon light. The overall mood is technological and professional, fitting a high-end AI video creation environment." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDvaIX9t9LmsS5LB_-39UueCbE8JzW6BR5z1bx1E7ZV9rDUKD4A3wMZuU8m9gV-tKD21bvcv2Y7uxc9IIi7_ZVqtPT4yWRvgaeJjmWUKkolQw_ckYD-e5oza05nsSIcn98O6WKcEu5EkegUvXdGck9yAk0mSm-b0ic60U0ucAiCPFgAlQgziE4lugmLz8rAsy3RxQ3urwW4LfjP3k1b7DqaydJ69CeEcBgVbu4sf99vHfW4GYCBU0MICalN8ekPNpVd8lHYZroxCkw"/>
<div class="absolute inset-0 bg-gradient-to-t from-background/80 to-transparent flex flex-col justify-end p-2">
<span class="font-label-sm text-label-sm truncate">broll_scene_01.jpg</span>
<span class="font-label-sm text-label-sm text-on-surface-variant">2.4 MB</span>
</div>
</div>
</div>
</div>
<!-- Avatar -->
<div class="w-8 h-8 rounded-full bg-surface-container-highest border border-outline-variant flex items-center justify-center flex-shrink-0">
<span class="material-symbols-outlined text-[18px] text-on-surface-variant">person</span>
</div>
</div>
<!-- Failed Upload Item -->
<div class="flex gap-3 justify-end w-full">
<div class="max-w-[85%]">
<div class="bg-surface-container-highest rounded-xl p-panel-padding border border-error/30 shadow-lg flex flex-col gap-3 relative overflow-hidden">
<!-- Error Glow Indicator -->
<div class="absolute left-0 top-0 bottom-0 w-1 bg-error"></div>
<div class="flex items-start justify-between">
<div class="flex items-center gap-2 text-error">
<span class="material-symbols-outlined text-[18px]" style="font-variation-settings: 'FILL' 1;">error</span>
<span class="font-label-md text-label-md text-error">Upload Failed</span>
</div>
</div>
<div class="bg-surface-container-lowest p-3 rounded-lg border border-outline-variant/20 flex items-center gap-3">
<div class="w-12 h-12 bg-surface flex items-center justify-center rounded border border-outline-variant/30">
<span class="material-symbols-outlined text-on-surface-variant text-[24px]">movie</span>
</div>
<div class="flex flex-col flex-1 min-w-0">
<span class="font-label-md text-label-md truncate text-on-surface">video_export.mov</span>
<span class="font-label-sm text-label-sm text-error">File too large (Max: 500MB)</span>
</div>
</div>
<div class="flex gap-2 mt-1">
<button class="flex-1 bg-surface-container hover:bg-surface-bright border border-outline-variant/50 text-on-surface font-label-md text-label-md py-2 rounded transition-colors active:scale-95 duration-150 flex items-center justify-center gap-1">
<span class="material-symbols-outlined text-[16px]">delete</span>
                            Remove
                        </button>
<button class="flex-1 bg-primary-container/10 hover:bg-primary-container/20 border border-primary-container/30 text-primary-container font-label-md text-label-md py-2 rounded transition-colors active:scale-95 duration-150 flex items-center justify-center gap-1">
<span class="material-symbols-outlined text-[16px]">refresh</span>
                            Retry
                        </button>
</div>
</div>
</div>
<!-- Avatar -->
<div class="w-8 h-8 rounded-full bg-surface-container-highest border border-outline-variant flex items-center justify-center flex-shrink-0">
<span class="material-symbols-outlined text-[18px] text-on-surface-variant">person</span>
</div>
</div>
</main>
<!-- Bottom Input Area (Empty state for context) -->
<div class="bg-surface-container-low border-t border-outline-variant/30 p-margin-mobile flex items-center gap-3">
<button class="w-10 h-10 rounded-full bg-surface-container-high border border-outline-variant/50 flex items-center justify-center text-on-surface hover:text-primary-container transition-colors shrink-0">
<span class="material-symbols-outlined text-[20px]">add</span>
</button>
<div class="flex-1 bg-surface-container-highest rounded-full h-10 border border-outline-variant/30 flex items-center px-4">
<span class="font-label-md text-label-md text-on-surface-variant">Type a message...</span>
</div>
</div>
</body></html>
