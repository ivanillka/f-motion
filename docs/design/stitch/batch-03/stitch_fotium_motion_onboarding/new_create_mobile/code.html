<style>
    body {
      min-height: max(884px, 100dvh);
    }

  </head>
<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md overflow-hidden">
<!-- TopAppBar (Small, Compact for Project) -->
<header class="docked full-width top-0 bg-background dark:bg-background flex justify-between items-center w-full px-margin-mobile h-16 shrink-0 z-50">
<div class="flex items-center gap-2">
<button class="p-2 text-on-surface-variant hover:text-primary transition-all duration-200 rounded-full">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
</button>
<div class="flex flex-col">
<span class="font-headline-sm text-headline-sm font-black text-on-surface">Untitled Project</span>
<span class="font-label-sm text-label-sm text-on-surface-variant flex items-center gap-1">
<span class="material-symbols-outlined text-[10px]">cloud_done</span> Saved
                </span>
</div>
</div>
<div class="flex items-center gap-4">
<button class="text-on-surface-variant hover:text-primary transition-all duration-200">
<span class="material-symbols-outlined">more_vert</span>
</button>
</div>
</header>
<!-- Main Conversation Area -->
<main class="flex-1 overflow-y-auto px-margin-mobile py-stack-md flex flex-col gap-stack-lg relative pb-24">
<!-- Assistant Message -->
<div class="flex flex-col gap-stack-md animate-fade-in-up">
<div class="flex items-center gap-3">
<div class="w-8 h-8 rounded-full bg-surface-container-high flex items-center justify-center border border-outline-variant">
<span class="material-symbols-outlined text-primary-container text-sm">smart_toy</span>
</div>
<span class="font-label-md text-label-md text-on-surface">Fotium Assistant</span>
</div>
<div class="bg-surface-container-low p-panel-padding rounded-xl rounded-tl-none border border-outline-variant max-w-[85%] self-start shadow-sm">
<p class="font-body-md text-on-surface">What would you like to create today? Select a format to get started, or describe your vision.</p>
</div>
</div>
<!-- Format Selection Cards (Bento Grid Style) -->
<div class="grid grid-cols-2 gap-unit w-full max-w-[85%] self-start ml-11">
<!-- YouTube (Horizontal) -->
<button class="col-span-2 bg-surface-container flex items-center justify-between p-panel-padding rounded-xl border border-outline-variant hover:border-primary-container/30 hover:bg-surface-container-high transition-all group relative overflow-hidden text-left focus:outline-none focus:ring-1 focus:ring-primary-container">
<div class="absolute inset-0 bg-gradient-to-r from-primary-container/5 to-transparent opacity-0 group-hover:opacity-100 transition-opacity"></div>
<div class="flex flex-col gap-1 z-10">
<span class="font-headline-md-mobile text-headline-md-mobile text-on-surface">YouTube</span>
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider">16:9 • Cinematic</span>
</div>
<div class="w-10 h-6 border-2 border-on-surface-variant rounded-sm flex items-center justify-center opacity-50 group-hover:border-primary-container group-hover:opacity-100 transition-all z-10">
<span class="material-symbols-outlined text-[16px]">play_arrow</span>
</div>
</button>
<!-- Reel (Vertical) -->
<button class="col-span-1 bg-surface-container flex flex-col justify-between p-panel-padding rounded-xl border border-outline-variant hover:border-primary-container/30 hover:bg-surface-container-high transition-all group relative overflow-hidden text-left focus:outline-none focus:ring-1 focus:ring-primary-container min-h-[120px]">
<div class="absolute inset-0 bg-gradient-to-b from-primary-container/5 to-transparent opacity-0 group-hover:opacity-100 transition-opacity"></div>
<div class="w-6 h-10 border-2 border-on-surface-variant rounded-sm mx-auto mb-2 opacity-50 group-hover:border-primary-container group-hover:opacity-100 transition-all z-10 flex items-center justify-center">
<span class="material-symbols-outlined text-[12px]">smartphone</span>
</div>
<div class="flex flex-col gap-1 z-10">
<span class="font-headline-sm text-headline-sm text-on-surface">Reel</span>
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider">9:16</span>
</div>
</button>
<!-- Story (Vertical) -->
<button class="col-span-1 bg-surface-container flex flex-col justify-between p-panel-padding rounded-xl border border-outline-variant hover:border-primary-container/30 hover:bg-surface-container-high transition-all group relative overflow-hidden text-left focus:outline-none focus:ring-1 focus:ring-primary-container min-h-[120px]">
<div class="absolute inset-0 bg-gradient-to-b from-secondary-container/5 to-transparent opacity-0 group-hover:opacity-100 transition-opacity"></div>
<div class="w-6 h-10 border-2 border-on-surface-variant rounded-sm mx-auto mb-2 opacity-50 group-hover:border-secondary-container group-hover:opacity-100 transition-all z-10 flex items-center justify-center border-dashed">
<span class="material-symbols-outlined text-[12px]">history</span>
</div>
<div class="flex flex-col gap-1 z-10">
<span class="font-headline-sm text-headline-sm text-on-surface">Story</span>
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider">9:16 • Ephemeral</span>
</div>
</button>
</div>
<!-- Invisible spacer for bottom composer -->
<div class="h-20"></div>
</main>
<!-- Bottom Composer -->
<div class="fixed bottom-0 left-0 w-full bg-background border-t border-outline-variant/30 p-margin-mobile pb-6 z-40 shadow-[0_-10px_30px_rgba(0,0,0,0.5)]">
<div class="flex items-end gap-2 bg-[#121212] rounded-xl border border-outline-variant focus-within:border-primary-container focus-within:ring-1 focus-within:ring-primary-container/50 transition-all p-2 relative overflow-hidden">
<button class="p-2 text-on-surface-variant hover:text-primary-container transition-colors rounded-lg flex-shrink-0">
<span class="material-symbols-outlined">add_photo_alternate</span>
</button>
<textarea class="flex-1 bg-transparent border-none text-on-surface font-label-md text-label-md resize-none max-h-32 min-h-[40px] py-3 px-1 focus:ring-0 placeholder:text-on-surface-variant/50" placeholder="Describe what you want to create..." rows="1"></textarea>
<button class="p-2 bg-primary-container text-on-primary-container rounded-lg hover:bg-primary-fixed transition-colors flex-shrink-0 flex items-center justify-center">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">send</span>
</button>
</div>
</div>
<style>
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .animate-fade-in-up {
            animation: fadeInUp 0.4s ease-out forwards;
        }
        
        /* Custom scrollbar for text area */
        textarea::-webkit-scrollbar {
            width: 4px;
        }
        textarea::-webkit-scrollbar-track {
            background: transparent;
        }
        textarea::-webkit-scrollbar-thumb {
            background: #3b494b;
            border-radius: 4px;
        }
    </style>
<script>
        // Simple auto-resize for textarea
        const textarea = document.querySelector('textarea');
        textarea.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';
            if(this.value.trim() !== '') {
                this.classList.add('font-body-md');
                this.classList.remove('font-label-md');
            } else {
                 this.classList.remove('font-body-md');
                 this.classList.add('font-label-md');
            }
        });
    </script>
</body></html>
