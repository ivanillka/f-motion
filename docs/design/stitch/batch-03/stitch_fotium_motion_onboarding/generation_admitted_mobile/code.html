<style>
        .pulse-glow {
            animation: pulseGlow 2s infinite ease-in-out;
        }
        @keyframes pulseGlow {
            0% { box-shadow: 0 0 0 0 rgba(0, 240, 255, 0.2); }
            50% { box-shadow: 0 0 20px 5px rgba(0, 240, 255, 0.4); }
            100% { box-shadow: 0 0 0 0 rgba(0, 240, 255, 0.2); }
        }
        .progress-bar-fill {
            animation: fillProgress 3s infinite ease-in-out;
        }
        @keyframes fillProgress {
            0% { width: 0%; opacity: 0.8; }

        }

<!-- Decorative Ambient Background Gradient -->
<div class="absolute inset-0 z-0 pointer-events-none opacity-20 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-primary-container via-background to-background"></div>

<span class="material-symbols-outlined text-display-lg font-display-lg text-primary-container" style="font-variation-settings: 'FILL' 1;">

            </span>
</div>

<p class="font-body-md text-body-md text-on-surface-variant text-center mb-stack-lg max-w-xs">
            Your generation has been added to the render queue. You can safely return to the home screen or start a new project.
        </p>
<!-- Progress Indicator (Abstract) -->
<div class="w-full max-w-[240px] bg-surface-container-highest rounded-full h-2 mb-stack-lg overflow-hidden border border-outline-variant">
<div class="bg-primary-container h-full rounded-full progress-bar-fill"></div>
</div>
