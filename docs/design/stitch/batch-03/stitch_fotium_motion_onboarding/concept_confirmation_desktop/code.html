<body class="bg-surface text-on-surface h-screen w-full flex overflow-hidden">
<!-- Top Navigation (Mobile Only) / No Side Nav - Transactional Screen -->
<header class="flex md:hidden justify-between items-center w-full px-margin-mobile h-16 sticky top-0 z-40 bg-surface border-b border-surface-variant">
<button class="text-on-surface-variant p-2 rounded-full hover:bg-surface-container-high transition-colors">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
</button>
<span class="font-headline-sm text-headline-sm font-bold text-primary-fixed-dim">Fotium Motion</span>
<div class="w-10"></div> <!-- Placeholder for balance -->
</header>
<!-- Main Canvas -->
<main class="flex-1 h-full overflow-y-auto relative flex items-center justify-center p-gutter md:p-margin-desktop bg-surface-container-lowest">
<!-- Concept Confirmation Card -->
<div class="w-full max-w-2xl bg-surface-container-low rounded-xl border border-surface-variant shadow-lg flex flex-col overflow-hidden relative">
<!-- Subtle Cyan Glow Indicator for Active Priority -->
<div class="absolute top-0 left-0 w-full h-1 bg-primary-container opacity-20"></div>
<!-- Header Section -->
<div class="p-stack-lg border-b border-surface-variant flex flex-col md:flex-row gap-stack-md justify-between items-start md:items-center">
<div>
<h2 class="font-headline-md text-headline-md text-on-surface mb-stack-sm">Concept Selected</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Review your chosen aesthetic before generating the preview.</p>
</div>
<!-- Selected Concept Tag -->
<div class="bg-surface-container-highest px-4 py-2 rounded border border-outline-variant flex items-center gap-2">
<span class="material-symbols-outlined text-primary-fixed-dim text-lg" style="font-variation-settings: 'FILL' 1;">bolt</span>
<span class="font-label-md text-label-md text-primary-fixed-dim tracking-widest uppercase">Cyberpunk Pulse</span>
</div>
</div>
<!-- Preview / Metadata Section -->
<div class="p-stack-lg flex flex-col md:flex-row gap-stack-lg bg-surface">
<!-- Concept Thumbnail Mockup -->
<div class="w-full md:w-1/2 aspect-video bg-surface-container rounded-lg border border-surface-variant relative overflow-hidden flex items-center justify-center">
<div class="absolute inset-0 bg-gradient-to-br from-secondary-container/20 to-primary-container/10"></div>
<img alt="Cyberpunk Concept Preview" class="object-cover w-full h-full opacity-80 mix-blend-screen" data-alt="A neon-drenched futuristic cyberpunk cityscape at night, with towering skyscrapers, holographic advertisements, and a dark rainy atmosphere. High contrast cyan and magenta lighting defining the mood, showcasing a high-end cinematic visual style suitable for a professional AI video generation tool preview." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBx2Kx3-IETWYjGp-mg8mzRwgt-B8rBICq0lasrpz347UQpoy9HwZCnAL8Ax8BF7MDsVjkSif7E7h3eHHBb8lXxbzpmNS14j1Z8-G1tZBpnEcsVO0oXeNVr1y3MsUnUkq4HoxqhVcQa4R2hwJUJQspe1wy_bhlTHfyMzOfD37WNszsWME9OKzvboHwW2Ce6T1BFoByvy7d2A6M5kV9APyn733ytytH7s_StEShNhsTJHHHJiWXkFSZvp90MTND59n6KlhtJcjYdnNI"/>
</div>
<!-- Generation Details -->
<div class="w-full md:w-1/2 flex flex-col justify-center gap-stack-md">
<div class="bg-surface-container-low p-panel-padding rounded border border-surface-variant">
<div class="flex items-center gap-2 mb-2">
<span class="material-symbols-outlined text-on-surface-variant text-sm">speed</span>
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider">Estimated Cost</span>
</div>
<div class="flex items-baseline gap-2">
<span class="font-headline-sm text-headline-sm text-on-surface">15</span>
<span class="font-body-md text-body-md text-on-surface-variant">Credits</span>
</div>
<p class="font-body-md text-body-md text-on-surface-variant mt-1 text-xs opacity-75">Generate preview for approx 15 credits.</p>
</div>
<div class="bg-surface-container-highest p-panel-padding rounded border border-surface-variant">
<div class="flex items-center justify-between mb-1">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-secondary text-sm">account_balance_wallet</span>
<span class="font-label-sm text-label-sm text-secondary uppercase tracking-wider">Available Balance</span>
</div>
</div>
<div class="flex items-baseline gap-2">
<span class="font-headline-sm text-headline-sm text-secondary">100</span>
<span class="font-body-md text-body-md text-on-surface-variant">Credits</span>
</div>
</div>
</div>
</div>
<!-- Action Footer -->
<div class="p-stack-lg border-t border-surface-variant bg-surface-container-low flex flex-col md:flex-row justify-end gap-stack-md items-center">
<button class="w-full md:w-auto px-6 py-3 rounded text-on-surface bg-transparent border border-outline-variant hover:bg-surface-container-highest hover:text-white transition-all font-label-md text-label-md uppercase tracking-wider flex items-center justify-center gap-2 group">
<span class="material-symbols-outlined text-lg group-hover:-translate-x-1 transition-transform">edit</span>
                    Edit concept
                </button>
<button class="w-full md:w-auto px-6 py-3 rounded text-on-primary-container bg-primary-container hover:bg-primary transition-colors font-label-md text-label-md uppercase tracking-wider font-bold shadow-[0_0_15px_rgba(0,240,255,0.15)] flex items-center justify-center gap-2 group relative overflow-hidden">
<div class="absolute inset-0 bg-white/20 translate-y-full group-hover:translate-y-0 transition-transform duration-300 ease-out"></div>
<span class="relative z-10 material-symbols-outlined text-lg">play_arrow</span>
<span class="relative z-10">Generate preview</span>
</button>
</div>
</div>
