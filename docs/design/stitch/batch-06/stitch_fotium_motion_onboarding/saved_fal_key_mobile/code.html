<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Fotium Motion - FAL Key Settings</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&amp;family=Inter:wght@400;500;600&amp;family=Geist:wght@600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "surface-variant": "#353534",
                        "tertiary-container": "#ffccd6",
                        "surface-container-low": "#1c1b1b",
                        "error-container": "#93000a",
                        "on-error-container": "#ffdad6",
                        "on-tertiary-fixed-variant": "#8f0041",
                        "outline": "#849495",
                        "surface": "#131313",
                        "on-secondary": "#480081",
                        "surface-dim": "#131313",
                        "secondary-fixed": "#efdbff",
                        "surface-container-lowest": "#0e0e0e",
                        "surface-bright": "#393939",
                        "on-primary": "#00363a",
                        "surface-container-highest": "#353534",
                        "tertiary": "#fff3f4",
                        "primary-fixed-dim": "#00dbe9",
                        "on-background": "#e5e2e1",
                        "error": "#ffb4ab",
                        "secondary-fixed-dim": "#dcb8ff",
                        "on-primary-container": "#006970",
                        "tertiary-fixed": "#ffd9e0",
                        "on-secondary-fixed": "#2c0051",
                        "primary": "#dbfcff",
                        "on-surface": "#e5e2e1",
                        "background": "#131313",
                        "surface-container": "#201f1f",
                        "primary-fixed": "#7df4ff",
                        "on-tertiary-fixed": "#3f0019",
                        "on-surface-variant": "#b9cacb",
                        "inverse-surface": "#e5e2e1",
                        "on-primary-fixed-variant": "#004f54",
                        "surface-tint": "#00dbe9",
                        "primary-container": "#00f0ff",
                        "inverse-on-surface": "#313030",
                        "secondary": "#dcb8ff",
                        "on-secondary-fixed-variant": "#6700b5",
                        "on-error": "#690005",
                        "secondary-container": "#7701d0",
                        "on-tertiary": "#66002c",
                        "inverse-primary": "#006970",
                        "on-tertiary-container": "#bb0058",
                        "on-secondary-container": "#dcb7ff",
                        "surface-container-high": "#2a2a2a",
                        "outline-variant": "#3b494b",
                        "tertiary-fixed-dim": "#ffb1c3",
                        "on-primary-fixed": "#002022"
                    },
                    borderRadius: {
                        DEFAULT: "0.125rem",
                        lg: "0.25rem",
                        xl: "0.5rem",
                        full: "0.75rem"
                    },
                    spacing: {
                        "panel-padding": "12px",
                        "stack-sm": "8px",
                        "unit": "4px",
                        "stack-lg": "32px",
                        "gutter": "16px",
                        "margin-desktop": "24px",
                        "margin-mobile": "16px",
                        "stack-md": "16px"
                    },
                    fontFamily: {
                        "label-md": ["JetBrains Mono"],
                        "display-lg": ["Geist"],
                        "headline-sm": ["Geist"],
                        "headline-md-mobile": ["Geist"],
                        "body-lg": ["Inter"],
                        "label-sm": ["JetBrains Mono"],
                        "headline-md": ["Geist"],
                        "body-md": ["Inter"]
                    },
                    fontSize: {
                        "label-md": ["12px", { lineHeight: "16px", letterSpacing: "0.05em", fontWeight: "500" }],
                        "display-lg": ["48px", { lineHeight: "56px", letterSpacing: "-0.02em", fontWeight: "700" }],
                        "headline-sm": ["20px", { lineHeight: "28px", fontWeight: "600" }],
                        "headline-md-mobile": ["20px", { lineHeight: "28px", fontWeight: "600" }],
                        "body-lg": ["16px", { lineHeight: "24px", fontWeight: "400" }],
                        "label-sm": ["10px", { lineHeight: "14px", fontWeight: "500" }],
                        "headline-md": ["24px", { lineHeight: "32px", fontWeight: "600" }],
                        "body-md": ["14px", { lineHeight: "20px", fontWeight: "400" }]
                    }
                }
            }
        }
    </script>
<style>
        body {
            background-color: theme('colors.background');
            color: theme('colors.on-background');
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="antialiased min-h-screen flex flex-col">
<!-- Top Navigation (Mobile Specific) -->
<header class="flex items-center justify-between px-margin-mobile h-16 bg-surface-container-lowest border-b border-outline-variant md:hidden">
<div class="flex items-center gap-stack-sm text-on-surface">
<button aria-label="Go Back" class="p-2 -ml-2 rounded-full hover:bg-surface-variant transition-colors">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
</button>
<h1 class="font-headline-md-mobile text-headline-md-mobile">API Keys</h1>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 px-margin-mobile py-stack-md flex flex-col gap-stack-lg max-w-md mx-auto w-full md:px-margin-desktop md:py-stack-lg md:max-w-2xl mt-4">
<!-- Key Details Card -->
<section class="bg-surface-container-low rounded-xl p-gutter border border-outline-variant flex flex-col gap-stack-md relative overflow-hidden">
<div class="absolute top-0 right-0 w-32 h-32 bg-primary opacity-5 blur-3xl rounded-full -mr-16 -mt-16 pointer-events-none"></div>
<div class="flex justify-between items-start">
<div>
<h2 class="font-headline-sm text-headline-sm text-on-surface mb-unit">FAL AI</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Used for image generation</p>
</div>
<div class="bg-surface-container-high px-3 py-1 rounded-full flex items-center gap-2 border border-[#FFFFFF10]">
<div class="w-2 h-2 rounded-full bg-primary-container shadow-[0_0_8px_rgba(0,240,255,0.6)]"></div>
<span class="font-label-sm text-label-sm text-on-surface tracking-wider uppercase">Connected</span>
</div>
</div>
<div class="bg-surface rounded-lg p-3 border border-[#FFFFFF10] flex items-center justify-between mt-2 group">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-outline-variant" style="font-variation-settings: 'FILL' 0;">key</span>
<span class="font-label-md text-label-md text-on-surface-variant tracking-widest font-mono">fal_key_••••••••194a</span>
</div>
<button aria-label="Copy Key Fingerprint" class="text-on-surface-variant hover:text-primary transition-colors p-1">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0; font-size: 20px;">content_copy</span>
</button>
</div>
<div class="grid grid-cols-2 gap-4 mt-2">
<div class="flex flex-col">
<span class="font-label-sm text-label-sm text-outline-variant uppercase mb-1">Added</span>
<span class="font-body-md text-body-md text-on-surface">Oct 24, 2023</span>
</div>
<div class="flex flex-col">
<span class="font-label-sm text-label-sm text-outline-variant uppercase mb-1">Last Used</span>
<span class="font-body-md text-body-md text-on-surface">2 hours ago</span>
</div>
</div>
</section>
<!-- Action Controls -->
<section class="flex flex-col gap-stack-sm">
<button class="w-full h-12 flex items-center justify-center gap-2 bg-surface-container-high hover:bg-surface-variant text-on-surface rounded-lg border border-[#FFFFFF20] transition-colors font-label-md text-label-md uppercase tracking-wider">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0; font-size: 20px;">science</span>
                Test Connection
            </button>
<button class="w-full h-12 flex items-center justify-center gap-2 bg-surface-container-high hover:bg-surface-variant text-on-surface rounded-lg border border-[#FFFFFF20] transition-colors font-label-md text-label-md uppercase tracking-wider">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0; font-size: 20px;">autorenew</span>
                Replace Key
            </button>
</section>
<!-- Danger Zone -->
<section class="mt-auto pt-stack-lg pb-8">
<button class="w-full h-12 flex items-center justify-center gap-2 bg-transparent text-error hover:bg-error-container hover:text-on-error-container rounded-lg border border-error-container transition-colors font-label-md text-label-md uppercase tracking-wider">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0; font-size: 20px;">delete</span>
                Disconnect
            </button>
</section>
</main>
</body></html>
