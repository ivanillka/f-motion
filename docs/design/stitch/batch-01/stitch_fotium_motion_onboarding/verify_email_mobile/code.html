<!DOCTYPE html>

                    "fontFamily": {

<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-background text-on-surface min-h-screen flex flex-col font-body-lg">
<!-- No Nav - Transactional Screen -->
<main class="flex-1 flex flex-col items-center justify-center p-margin-mobile">
<div class="w-full max-w-sm flex flex-col items-center text-center space-y-stack-lg">
<!-- Icon/Visual -->
<div class="w-24 h-24 bg-surface-container-high rounded-full flex items-center justify-center relative shadow-[0_0_20px_rgba(0,240,255,0.1)]">
<span class="material-symbols-outlined text-4xl text-primary" style="font-variation-settings: 'FILL' 1;">
                    mail
                </span>
<!-- Subtle decorative ring -->
<div class="absolute inset-0 border border-primary/20 rounded-full animate-ping" style="animation-duration: 3s;"></div>
</div>
<!-- Header Content -->
<div class="space-y-stack-sm">
<h1 class="font-headline-md-mobile text-headline-md-mobile text-on-surface">Check your email</h1>
<p class="font-body-md text-body-md text-on-surface-variant max-w-xs mx-auto">
                    We've sent a magic link to your email address. Click the link to sign in.
                </p>
</div>
<!-- Email Display -->
<div class="bg-surface-container py-3 px-4 border border-outline-variant rounded-lg w-full">
<span class="font-label-md text-label-md text-primary truncate block text-center">creator@example.com</span>
</div>
<!-- Actions -->
<div class="w-full space-y-stack-md pt-4">
<button class="w-full bg-primary-container text-background font-label-md text-label-md py-3 px-4 rounded-full hover:opacity-90 transition-opacity flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-[18px]">open_in_new</span>
                    Open Email App
                </button>
<button class="w-full border border-outline-variant text-on-surface font-label-md text-label-md py-3 px-4 rounded-full hover:bg-surface-container-high transition-colors">
                    Resend Email
                </button>
</div>
<!-- Contextual Navigation -->
<button class="text-on-surface-variant hover:text-primary transition-colors flex items-center gap-2 mt-8 font-label-md text-label-md">
<span class="material-symbols-outlined text-[16px]">arrow_back</span>
                Back to Sign In
            </button>
</div>
</main>
</body></html>
