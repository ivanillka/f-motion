<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Fotium Motion - Format Selection</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Geist:wght@600;700&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "tertiary-fixed-dim": "#ffb1c3",
                        "on-primary-container": "#006970",
                        "on-secondary-fixed": "#2c0051",
                        "tertiary-fixed": "#ffd9e0",
                        "inverse-primary": "#006970",
                        "on-secondary-fixed-variant": "#6700b5",
                        "outline": "#849495",
                        "on-primary-fixed": "#002022",
                        "on-error": "#690005",
                        "surface-bright": "#393939",
                        "on-background": "#e5e2e1",
                        "secondary": "#dcb8ff",
                        "on-surface": "#e5e2e1",
                        "tertiary": "#fff3f4",
                        "on-error-container": "#ffdad6",
                        "on-surface-variant": "#b9cacb",
                        "surface-tint": "#00dbe9",
                        "inverse-surface": "#e5e2e1",
                        "surface-container-highest": "#353534",
                        "background": "#131313",
                        "surface-container-lowest": "#0e0e0e",
                        "secondary-fixed-dim": "#dcb8ff",
                        "outline-variant": "#3b494b",
                        "surface-container": "#201f1f",
                        "surface-container-low": "#1c1b1b",
                        "secondary-container": "#7701d0",
                        "primary": "#dbfcff",
                        "surface-dim": "#131313",
                        "on-primary": "#00363a",
                        "secondary-fixed": "#efdbff",
                        "on-secondary-container": "#dcb7ff",
                        "on-tertiary": "#66002c",
                        "error-container": "#93000a",
                        "on-tertiary-container": "#bb0058",
                        "on-tertiary-fixed-variant": "#8f0041",
                        "on-primary-fixed-variant": "#004f54",
                        "primary-fixed-dim": "#00dbe9",
                        "surface": "#131313",
                        "surface-container-high": "#2a2a2a",
                        "inverse-on-surface": "#313030",
                        "primary-container": "#00f0ff",
                        "on-tertiary-fixed": "#3f0019",
                        "tertiary-container": "#ffccd6",
                        "surface-variant": "#353534",
                        "error": "#ffb4ab",
                        "primary-fixed": "#7df4ff",
                        "on-secondary": "#480081"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "stack-sm": "8px",
                        "unit": "4px",
                        "margin-desktop": "24px",
                        "stack-lg": "32px",
                        "panel-padding": "12px",
                        "gutter": "16px",
                        "stack-md": "16px",
                        "margin-mobile": "16px"
                    },
                    "fontFamily": {
                        "body-lg": ["Inter"],
                        "display-lg": ["Geist"],
                        "headline-sm": ["Geist"],
                        "headline-md-mobile": ["Geist"],
                        "label-sm": ["JetBrains Mono"],
                        "label-md": ["JetBrains Mono"],
                        "headline-md": ["Geist"],
                        "body-md": ["Inter"]
                    },
                    "fontSize": {
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "display-lg": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "headline-sm": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "headline-md-mobile": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "label-sm": ["10px", { "lineHeight": "14px", "fontWeight": "500" }],
                        "label-md": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "500" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
        .format-card {
            transition: all 0.2s ease-out;
        }
        .format-card.selected {
            border-color: theme('colors.primary-container');
            background-color: theme('colors.surface-container-highest');
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.1);
        }
        .format-card.selected .check-icon {
            opacity: 1;
            transform: scale(1);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-surface h-screen flex flex-col font-body-lg overflow-hidden">
<!-- Top Navigation (Mobile) -->
<header class="flex justify-between items-center px-margin-mobile w-full h-16 bg-background shrink-0">
<button aria-label="Back" class="text-on-surface-variant hover:text-primary-fixed-dim transition-colors duration-200">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="font-headline-md-mobile text-headline-md-mobile text-primary tracking-tighter">Fotium Motion</h1>
<div class="w-6 h-6"></div> <!-- Spacer for centering -->
</header>
<!-- Main Content Canvas -->
<main class="flex-1 flex flex-col px-margin-mobile py-stack-lg overflow-y-auto">
<div class="mb-stack-lg text-center">
<h2 class="font-headline-sm text-headline-sm text-on-surface mb-stack-sm">Choose Format</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Select the aspect ratio for your project.</p>
</div>
<div class="flex flex-col gap-stack-md flex-1">
<!-- YouTube / 16:9 Format -->
<button class="format-card selected relative w-full flex items-center p-gutter bg-surface-container-low border border-outline-variant rounded-xl text-left" onclick="selectFormat(this)">
<div class="w-16 h-12 bg-surface-container-high rounded border border-outline flex items-center justify-center mr-gutter shrink-0">
<span class="material-symbols-outlined text-on-surface-variant" style="font-variation-settings: 'FILL' 0;">tv</span>
</div>
<div class="flex-1">
<h3 class="font-headline-sm text-headline-sm text-on-surface">Widescreen</h3>
<p class="font-body-md text-body-md text-on-surface-variant">16:9 • YouTube, Cinematic</p>
</div>
<div class="check-icon absolute top-4 right-4 w-6 h-6 bg-primary-container rounded-full flex items-center justify-center opacity-1 scale-100 transition-all duration-200">
<span class="material-symbols-outlined text-on-primary-container text-[16px]" style="font-variation-settings: 'FILL' 1;">check</span>
</div>
</button>
<!-- Shorts / 9:16 Format -->
<button class="format-card relative w-full flex items-center p-gutter bg-surface-container-low border border-outline-variant rounded-xl text-left" onclick="selectFormat(this)">
<div class="w-10 h-16 bg-surface-container-high rounded border border-outline flex items-center justify-center mx-[12px] mr-[16px] shrink-0">
<span class="material-symbols-outlined text-on-surface-variant" style="font-variation-settings: 'FILL' 0;">smartphone</span>
</div>
<div class="flex-1">
<h3 class="font-headline-sm text-headline-sm text-on-surface">Vertical</h3>
<p class="font-body-md text-body-md text-on-surface-variant">9:16 • Reels, Shorts, TikTok</p>
</div>
<div class="check-icon absolute top-4 right-4 w-6 h-6 bg-primary-container rounded-full flex items-center justify-center opacity-0 scale-50 transition-all duration-200">
<span class="material-symbols-outlined text-on-primary-container text-[16px]" style="font-variation-settings: 'FILL' 1;">check</span>
</div>
</button>
<!-- Square / 1:1 Format -->
<button class="format-card relative w-full flex items-center p-gutter bg-surface-container-low border border-outline-variant rounded-xl text-left" onclick="selectFormat(this)">
<div class="w-14 h-14 bg-surface-container-high rounded border border-outline flex items-center justify-center mx-[4px] mr-[12px] shrink-0">
<span class="material-symbols-outlined text-on-surface-variant" style="font-variation-settings: 'FILL' 0;">crop_square</span>
</div>
<div class="flex-1">
<h3 class="font-headline-sm text-headline-sm text-on-surface">Square</h3>
<p class="font-body-md text-body-md text-on-surface-variant">1:1 • Instagram Feed, Ads</p>
</div>
<div class="check-icon absolute top-4 right-4 w-6 h-6 bg-primary-container rounded-full flex items-center justify-center opacity-0 scale-50 transition-all duration-200">
<span class="material-symbols-outlined text-on-primary-container text-[16px]" style="font-variation-settings: 'FILL' 1;">check</span>
</div>
</button>
</div>
<!-- Next Button -->
<div class="mt-auto pt-stack-lg pb-stack-md">
<button class="w-full bg-primary-container text-on-primary-fixed py-[14px] rounded-lg font-headline-md-mobile text-headline-md-mobile flex items-center justify-center gap-2 hover:bg-primary-fixed transition-colors">
                Continue
                <span class="material-symbols-outlined">arrow_forward</span>
</button>
</div>
</main>
<script>
        function selectFormat(selectedElement) {
            // Remove 'selected' class from all cards
            const cards = document.querySelectorAll('.format-card');
            cards.forEach(card => {
                card.classList.remove('selected');
                const checkIcon = card.querySelector('.check-icon');
                if(checkIcon) {
                    checkIcon.classList.remove('opacity-1', 'scale-100');
                    checkIcon.classList.add('opacity-0', 'scale-50');
                }
            });

            // Add 'selected' class to clicked card
            selectedElement.classList.add('selected');
            const checkIcon = selectedElement.querySelector('.check-icon');
            if(checkIcon) {
                checkIcon.classList.remove('opacity-0', 'scale-50');
                checkIcon.classList.add('opacity-1', 'scale-100');
            }
        }
    </script>
</body></html>
