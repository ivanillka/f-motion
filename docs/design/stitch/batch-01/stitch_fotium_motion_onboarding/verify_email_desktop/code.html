<main class="w-full max-w-md bg-surface-container-low rounded-xl p-stack-lg border border-outline-variant/30 relative overflow-hidden">
<!-- Subtle Ambient Glow -->
<div class="absolute -top-24 -right-24 w-48 h-48 bg-primary/5 rounded-full blur-[64px] pointer-events-none"></div>
<div class="flex flex-col items-center text-center space-y-stack-md relative z-10">
<!-- Icon -->

<span class="material-symbols-outlined text-primary-container text-4xl" style="font-variation-settings: 'FILL' 1;">mail</span>
</div>
<!-- Headers -->
<div class="space-y-unit">
<h1 class="font-headline-md text-headline-md md:font-display-lg md:text-headline-md text-on-surface">Check your email</h1>
<p class="font-body-md text-body-md text-on-surface-variant">We've sent a verification link to:</p>
<p class="font-label-md text-label-md text-primary mt-unit font-bold">studio@example.com</p>
</div>
<!-- Explanation -->
<div class="bg-surface p-panel-padding rounded-lg w-full text-left mt-stack-md border border-outline-variant/20">
<p class="font-body-md text-body-md text-on-surface-variant">
                    Click the link in the email to verify your account and access Fotium Motion. If you don't see it, check your spam folder.
                </p>
</div>
<!-- Primary Action -->
<button class="w-full bg-primary-container text-background font-label-md text-label-md py-3 rounded-DEFAULT hover:bg-primary transition-colors flex items-center justify-center gap-2 mt-stack-md">
<span class="material-symbols-outlined text-xl">open_in_new</span>
                Open my email app
            </button>
<!-- Secondary Actions -->
<div class="flex flex-col items-center space-y-stack-sm w-full mt-stack-lg border-t border-outline-variant/30 pt-stack-md">
<button class="text-on-surface-variant hover:text-primary transition-colors font-label-sm text-label-sm flex items-center gap-1 group" id="resendBtn">
<span class="material-symbols-outlined text-sm group-hover:rotate-180 transition-transform duration-500">refresh</span>
                    Resend link <span class="ml-1 text-outline" id="cooldown">(60s)</span>
</button>
<a class="text-on-surface-variant hover:text-on-surface transition-colors font-label-sm text-label-sm underline decoration-outline-variant/50 hover:decoration-on-surface" href="#">
                    Use a different email
                </a>
</div>
</div>
</main>
<!-- Footer suppressed for clean focus -->
<script>
        // Simple cooldown logic
        document.addEventListener('DOMContentLoaded', () => {
            let timeLeft = 60;
            const cooldownSpan = document.getElementById('cooldown');
            const resendBtn = document.getElementById('resendBtn');
            
            resendBtn.style.opacity = '0.5';
            resendBtn.style.pointerEvents = 'none';

            const timer = setInterval(() => {
                timeLeft--;
                if (timeLeft <= 0) {
                    clearInterval(timer);
                    cooldownSpan.textContent = '';
                    resendBtn.style.opacity = '1';
                    resendBtn.style.pointerEvents = 'auto';
                } else {
                    cooldownSpan.textContent = `(${timeLeft}s)`;
                }
            }, 1000);

            resendBtn.addEventListener('click', () => {
                if(timeLeft <= 0) {
                    // Reset
                    timeLeft = 60;
                    resendBtn.style.opacity = '0.5';
                    resendBtn.style.pointerEvents = 'none';
                    // Restart timer logic here in a real app
                }
            });
        });
    </script>
