<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Fotium Motion - Sign In</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;600;700&amp;family=Inter:wght@400&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "tertiary-fixed-dim": "#ffb1c3",
                        "on-primary-container": "#006970",
                        "on-secondary-fixed": "#2c0051",
                        "tertiary-fixed": "#ffd9e0",
                        "inverse-primary": "#006970",
                        "on-secondary-fixed-variant": "#6700b5",
                        "outline": "#849495",
                        "on-primary-fixed": "#002022",
                        "on-error": "#690005",
                        "surface-bright": "#393939",
                        "on-background": "#e5e2e1",
                        "secondary": "#dcb8ff",
                        "on-surface": "#e5e2e1",
                        "tertiary": "#fff3f4",
                        "on-error-container": "#ffdad6",
                        "on-surface-variant": "#b9cacb",
                        "surface-tint": "#00dbe9",
                        "inverse-surface": "#e5e2e1",
                        "surface-container-highest": "#353534",
                        "background": "#131313",
                        "surface-container-lowest": "#0e0e0e",
                        "secondary-fixed-dim": "#dcb8ff",
                        "outline-variant": "#3b494b",
                        "surface-container": "#201f1f",
                        "surface-container-low": "#1c1b1b",
                        "secondary-container": "#7701d0",
                        "primary": "#dbfcff",
                        "surface-dim": "#131313",
                        "on-primary": "#00363a",
                        "secondary-fixed": "#efdbff",
                        "on-secondary-container": "#dcb7ff",
                        "on-tertiary": "#66002c",
                        "error-container": "#93000a",
                        "on-tertiary-container": "#bb0058",
                        "on-tertiary-fixed-variant": "#8f0041",
                        "on-primary-fixed-variant": "#004f54",
                        "primary-fixed-dim": "#00dbe9",
                        "surface": "#131313",
                        "surface-container-high": "#2a2a2a",
                        "inverse-on-surface": "#313030",
                        "primary-container": "#00f0ff",
                        "on-tertiary-fixed": "#3f0019",
                        "tertiary-container": "#ffccd6",
                        "surface-variant": "#353534",
                        "error": "#ffb4ab",
                        "primary-fixed": "#7df4ff",
                        "on-secondary": "#480081"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "stack-sm": "8px",
                        "unit": "4px",
                        "margin-desktop": "24px",
                        "stack-lg": "32px",
                        "panel-padding": "12px",
                        "gutter": "16px",
                        "stack-md": "16px",
                        "margin-mobile": "16px"
                    },
                    "fontFamily": {
                        "body-lg": ["Inter"],
                        "display-lg": ["Geist"],
                        "headline-sm": ["Geist"],
                        "headline-md-mobile": ["Geist"],
                        "label-sm": ["JetBrains Mono"],
                        "label-md": ["JetBrains Mono"],
                        "headline-md": ["Geist"],
                        "body-md": ["Inter"]
                    },
                    "fontSize": {
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "display-lg": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "headline-sm": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "headline-md-mobile": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "label-sm": ["10px", { "lineHeight": "14px", "fontWeight": "500" }],
                        "label-md": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "500" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
        .glowing-element {
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.1);
        }
        .glowing-element:hover {
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.2);
        }
        
        @keyframes spin-slow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .animate-spin-slow {
            animation: spin-slow 3s linear infinite;
        }
    </style>
</head>
<body class="bg-background text-on-background antialiased min-h-screen flex flex-col font-body-lg overflow-x-hidden selection:bg-primary-container selection:text-on-primary-container">
<!-- Top App Bar (Modified for Transactional flow - no nav actions) -->
<header class="bg-background dark:bg-background flat no shadows flex justify-between items-center px-margin-desktop w-full h-16 top-0 sticky z-50">
<div class="font-display-lg text-headline-md tracking-tighter text-primary dark:text-primary flex items-center gap-stack-sm cursor-pointer transition-transform duration-100 hover:scale-[0.98]">
<span class="material-symbols-outlined text-primary-container" style="font-variation-settings: 'FILL' 1;">movie_creation</span>
<span>Fotium Motion</span>
</div>
<div class="text-on-surface-variant font-label-md text-label-md flex items-center gap-stack-sm">
<span>v2.4.0</span>
<span class="w-2 h-2 rounded-full bg-primary-container glowing-element"></span>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex items-center justify-center p-margin-mobile md:p-margin-desktop relative">
<!-- Abstract Background Element -->
<div class="absolute inset-0 z-0 pointer-events-none overflow-hidden opacity-30 flex items-center justify-center">
<div class="w-[800px] h-[800px] rounded-full border-[1px] border-outline-variant absolute animate-spin-slow" style="animation-duration: 60s;"></div>
<div class="w-[600px] h-[600px] rounded-full border-[1px] border-outline-variant absolute animate-spin-slow" style="animation-duration: 45s; animation-direction: reverse;"></div>
<div class="w-[400px] h-[400px] rounded-full border-[1px] border-primary-container/20 absolute"></div>
</div>
<!-- Auth Container -->
<div class="w-full max-w-[420px] bg-surface-container-high rounded-xl border border-[#FFFFFF10] p-stack-lg flex flex-col gap-stack-lg z-10 shadow-2xl relative">
<!-- Header Section -->
<div class="flex flex-col gap-stack-sm text-center">
<h1 class="font-headline-md text-headline-md text-on-surface">Access Workspace</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Sign in or create an account to continue to the studio environment.</p>
</div>
<!-- Action Section -->
<div class="flex flex-col gap-stack-md">
<!-- Google Button (Simulated Loading State Variant) -->
<button aria-label="Continuing with Google..." class="w-full h-12 bg-surface-container border border-outline-variant rounded-lg flex items-center justify-center gap-stack-sm font-label-md text-label-md text-on-surface hover:bg-surface-container-highest transition-colors relative overflow-hidden group cursor-wait">
<span class="material-symbols-outlined text-on-surface-variant animate-spin" style="font-variation-settings: 'FILL' 0;">sync</span>
<span>Connecting to Google...</span>
<!-- Loading progress bar indicator -->
<div class="absolute bottom-0 left-0 h-[2px] bg-primary-container w-1/3 rounded-full overflow-hidden">
<div class="w-full h-full bg-white/50 animate-pulse"></div>
</div>
</button>
<!-- Divider -->
<div class="flex items-center gap-stack-sm w-full py-stack-sm">
<div class="h-px bg-outline-variant flex-grow"></div>
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-widest">or</span>
<div class="h-px bg-outline-variant flex-grow"></div>
</div>
<!-- Email Form -->
<form class="flex flex-col gap-stack-md" onsubmit="event.preventDefault();">
<div class="flex flex-col gap-stack-sm">
<label class="font-label-md text-label-md text-on-surface-variant" for="email_input">Work Email</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant group-focus-within:text-primary-container transition-colors" style="font-size: 20px;">mail</span>
<input class="w-full h-12 bg-[#121212] border-none border-b-2 border-b-transparent focus:border-b-primary-container focus:ring-0 rounded-lg pl-10 pr-4 font-label-md text-label-md text-on-surface placeholder:text-on-surface-variant/50 transition-all outline-none" id="email_input" placeholder="studio@agency.com" required="" type="email"/>
</div>
</div>
<button class="w-full h-12 bg-primary-container text-[#002022] rounded-lg font-headline-sm text-headline-sm flex items-center justify-center gap-unit hover:bg-primary-fixed transition-colors active:scale-95 duration-100 mt-stack-sm glowing-element" type="submit">
<span>Continue with Email</span>
<span class="material-symbols-outlined" style="font-size: 20px;">arrow_forward</span>
</button>
</form>
</div>
<!-- Existing Account Path -->
<div class="text-center pt-stack-sm">
<a class="font-body-md text-body-md text-on-surface-variant hover:text-primary-container transition-colors border-b border-transparent hover:border-primary-container pb-[2px]" href="#">
                    Already have an account? Sign In
                </a>
</div>
<!-- Legal Footer -->
<div class="text-center mt-stack-sm pt-stack-md border-t border-outline-variant">
<p class="font-label-sm text-label-sm text-on-surface-variant leading-relaxed">
                    By proceeding, you acknowledge our <br/>
<a class="text-primary-container hover:underline" href="#">Terms of Service</a> and <a class="text-primary-container hover:underline" href="#">Privacy Policy</a>.
                </p>
</div>
</div>
</main>
<!-- Footer (Minimal for transactional page) -->
<footer class="bg-background dark:bg-background border-t border-outline-variant flex justify-between items-center px-margin-desktop py-stack-md w-full font-label-sm text-label-sm text-on-surface-variant dark:text-on-surface-variant mt-auto">
<div>© 2024 Fotium Motion AI. Professional Grade.</div>
<div class="flex gap-gutter">
<a class="hover:text-primary transition-colors" href="#">API Status</a>
</div>
</footer>
</body></html>
