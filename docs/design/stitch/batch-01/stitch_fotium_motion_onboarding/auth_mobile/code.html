<style>
        body {
            background-color: theme('colors.background');
            color: theme('colors.on-background');
        }
        
        /* Subtle glow animation for the brand logo */
        @keyframes pulse-cyan {
            0%, 100% { text-shadow: 0 0 10px rgba(0, 240, 255, 0.2); }
            50% { text-shadow: 0 0 20px rgba(0, 240, 255, 0.4); }
        }
        .brand-glow {
            animation: pulse-cyan 3s infinite ease-in-out;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="min-h-screen flex flex-col items-center justify-center p-margin-mobile relative overflow-hidden bg-background">
<!-- Decorative background elements -->
<div class="absolute top-0 left-0 w-full h-full overflow-hidden z-0 pointer-events-none opacity-20">
<div class="absolute -top-[20%] -left-[10%] w-[50%] h-[50%] rounded-full bg-primary-container blur-[100px] opacity-10"></div>
<div class="absolute -bottom-[20%] -right-[10%] w-[60%] h-[60%] rounded-full bg-secondary-container blur-[120px] opacity-10"></div>
</div>
<!-- Main Content Canvas -->
<main class="w-full max-w-[400px] z-10 flex flex-col gap-stack-lg">
<!-- Header Section -->
<div class="text-center flex flex-col items-center gap-stack-sm mb-stack-md">
<h1 class="font-display-lg text-headline-md-mobile text-primary brand-glow">Fotium Motion</h1>
<p class="font-body-md text-body-md text-on-surface-variant">The Invisible Assistant. Powerful, precise.</p>
</div>
<!-- Auth Card -->
<div class="bg-surface-container-high rounded-xl p-margin-mobile border border-outline-variant shadow-2xl relative">
<div class="absolute inset-0 rounded-xl border border-white/5 pointer-events-none"></div>
<div class="flex flex-col gap-stack-lg">
<!-- Email Sign In Form -->
<form class="flex flex-col gap-stack-md" onsubmit="event.preventDefault(); document.getElementById('magic-link-sent').classList.remove('hidden'); this.classList.add('hidden');">
<div class="flex flex-col gap-unit">
<label class="font-label-md text-label-md text-on-surface-variant uppercase tracking-widest" for="email">Email Address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant text-sm">mail</span>
<input class="w-full h-[44px] bg-surface pl-10 pr-4 rounded-DEFAULT border border-outline-variant text-on-surface focus:outline-none focus:border-primary-container focus:ring-1 focus:ring-primary-container font-body-md text-body-md transition-colors placeholder:text-surface-bright" id="email" placeholder="name@studio.com" required="" type="email"/>
</div>
</div>
<button class="h-[44px] w-full bg-primary-container text-[#000000] font-headline-sm text-headline-sm rounded-DEFAULT flex items-center justify-center gap-2 hover:bg-primary-fixed transition-colors active:scale-95 duration-100" type="submit">
                        Continue with Email
                        <span class="material-symbols-outlined text-sm">arrow_forward</span>
</button>
</form>
<!-- Magic Link Sent Feedback (Hidden by default) -->
<div class="hidden flex flex-col items-center text-center gap-stack-sm p-stack-sm bg-surface rounded-DEFAULT border border-primary-container/30" id="magic-link-sent">
<span class="material-symbols-outlined text-primary-container text-3xl">mark_email_read</span>
<p class="font-body-md text-body-md text-on-surface">Check your inbox. We sent a magic link to sign in.</p>
<button class="font-label-md text-label-md text-primary-container hover:text-primary mt-2 uppercase transition-colors" onclick="document.getElementById('magic-link-sent').classList.add('hidden'); document.querySelector('form').classList.remove('hidden');">Use different email</button>
</div>
<!-- Divider -->
<div class="flex items-center gap-gutter">
<div class="h-px bg-outline-variant flex-1"></div>
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase">Or</span>
<div class="h-px bg-outline-variant flex-1"></div>
</div>
<!-- OAuth Buttons -->
<div class="flex flex-col gap-stack-sm">
<button class="h-[44px] w-full bg-transparent border border-outline-variant text-on-surface font-body-md text-body-md rounded-DEFAULT flex items-center justify-center gap-3 hover:bg-surface-container-highest transition-colors active:scale-95 duration-100 relative group overflow-hidden">
<!-- Simulated Google Icon using SVG for accuracy since Material Symbols doesn't have brand icons -->
<svg class="w-5 h-5 z-10" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
<span class="z-10">Continue with Google</span>
<div class="absolute inset-0 bg-white/5 opacity-0 group-hover:opacity-100 transition-opacity"></div>
</button>
<button class="h-[44px] w-full bg-transparent border border-outline-variant text-on-surface font-body-md text-body-md rounded-DEFAULT flex items-center justify-center gap-3 hover:bg-surface-container-highest transition-colors active:scale-95 duration-100 relative group overflow-hidden">
<span class="material-symbols-outlined z-10 text-xl">file_download</span>
<span class="z-10">Continue with Apple</span>
<div class="absolute inset-0 bg-white/5 opacity-0 group-hover:opacity-100 transition-opacity"></div>
</button>
</div>
</div>
<!-- Subtle subtle accent line -->
<div class="absolute bottom-0 left-1/2 -translate-x-1/2 w-1/3 h-[1px] bg-gradient-to-r from-transparent via-primary-container to-transparent opacity-30"></div>
</div>
<!-- Footer Links -->
<div class="text-center mt-4">
<p class="font-label-sm text-label-sm text-on-surface-variant">
                By continuing, you agree to Fotium's <br/>
<a class="text-primary hover:underline transition-all" href="#">Terms of Service</a> and <a class="text-primary hover:underline transition-all" href="#">Privacy Policy</a>.
            </p>
</div>
</main>
</body></html>
