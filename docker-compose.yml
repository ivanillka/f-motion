# VPS product only (FENGINE_ENV=selfhost). Not f-motion.com, not corporate.
services:
  fmotion:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    image: f-motion:local
    ports:
      - "8080:8080"
    volumes:
      - fmotion-data:/data
    environment:
      FENGINE_ENV: selfhost
      FENGINE_PEXELS_BYOK_ENABLED: "1"
      FENGINE_FAL_BYOK_ENABLED: "1"

volumes:
  fmotion-data:
