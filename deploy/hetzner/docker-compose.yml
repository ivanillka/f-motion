# f-motion.com origin on a Hetzner VPS (API + worker + nginx).
# Keep existing session-mode Postgres and R2; this compose does not start
# local Postgres/MinIO (that is deploy/vps).
#
# From the repository root:
#   cp deploy/hetzner/.env.example deploy/hetzner/.env
#   # edit deploy/hetzner/.env
#   bash scripts/hetzner-up.sh

name: fmotion-hetzner

services:
  migrate:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    env_file:
      - .env
    environment:
      NODE_ENV: production
    entrypoint: ["npx", "prisma", "migrate", "deploy"]
    restart: "no"

  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    depends_on:
      migrate:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "3000"
      FENGINE_ENV: hosted
      FENGINE_ACCESS_MODE: ${FENGINE_ACCESS_MODE:-invite_only}
      PGSSLMODE: ${PGSSLMODE:-verify-full}
      PREVIEW_RENDER_WIDTH: ${PREVIEW_RENDER_WIDTH:-540}
      PREVIEW_RENDER_HEIGHT: ${PREVIEW_RENDER_HEIGHT:-960}
      RENDER_WIDTH: ${RENDER_WIDTH:-1080}
      RENDER_HEIGHT: ${RENDER_HEIGHT:-1920}
      FENGINE_PEXELS_BYOK_ENABLED: ${FENGINE_PEXELS_BYOK_ENABLED:-1}
      FENGINE_FAL_BYOK_ENABLED: ${FENGINE_FAL_BYOK_ENABLED:-0}
      OUTBOX_RETENTION_HOURS: ${OUTBOX_RETENTION_HOURS:-168}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  worker:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    command: ["node", "apps/worker/dist/start.js"]
    depends_on:
      api:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: production
      FENGINE_ENV: hosted
      PGSSLMODE: ${PGSSLMODE:-verify-full}
      PREVIEW_RENDER_WIDTH: ${PREVIEW_RENDER_WIDTH:-540}
      PREVIEW_RENDER_HEIGHT: ${PREVIEW_RENDER_HEIGHT:-960}
      RENDER_WIDTH: ${RENDER_WIDTH:-1080}
      RENDER_HEIGHT: ${RENDER_HEIGHT:-1920}
      FENGINE_PEXELS_BYOK_ENABLED: ${FENGINE_PEXELS_BYOK_ENABLED:-1}
      FENGINE_FAL_BYOK_ENABLED: ${FENGINE_FAL_BYOK_ENABLED:-0}
      OUTBOX_RETENTION_HOURS: ${OUTBOX_RETENTION_HOURS:-168}
    restart: unless-stopped

  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
        VITE_ENABLE_GOOGLE_AUTH: ${VITE_ENABLE_GOOGLE_AUTH:-}
        VITE_GIT_SHA: ${VITE_GIT_SHA:-dev}
        VITE_APP_VERSION: ${VITE_APP_VERSION}
        VITE_SITE_AT_ROOT: "1"
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${WEB_PUBLISH_PORT:-80}:80"
    restart: unless-stopped
