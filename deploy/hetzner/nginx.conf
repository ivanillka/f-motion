# api.f-motion.com replaces the Fly HTTP service.
server {
  listen 80;
  server_name api.f-motion.com;
  client_max_body_size 1m;

  location / {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
  }
}

# f-motion.com (or the VPS IP): SPA at root, same-origin /api.
server {
  listen 80 default_server;
  server_name _;
  root /usr/share/nginx/html;
  client_max_body_size 1m;

  location = /api/healthz {
    proxy_pass http://api:3000/healthz;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  location = /api/readyz {
    proxy_pass http://api:3000/readyz;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  location /api/ {
    proxy_pass http://api:3000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
  }

  location = /app {
    return 301 /studio;
  }

  location = /app/ {
    return 301 /studio;
  }

  location /app/ {
    rewrite ^/app/(.*)$ /studio/$1 redirect;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
