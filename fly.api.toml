# Fly.io app config for the F-Motion API. Deploy with:
#   fly launch --config fly.api.toml --no-deploy   # first time, creates the app
#   fly deploy  --config fly.api.toml
#
# Build context is the repo root (this file's directory) so the Dockerfile can
# reach the npm workspace tree. Secrets (never set here — use `fly secrets
# set`): DATABASE_URL, R2_ENDPOINT, R2_REGION, R2_BUCKET, R2_ACCESS_KEY_ID,
# R2_SECRET_ACCESS_KEY,
# SUPABASE_ISSUER, SUPABASE_AUDIENCE, SUPABASE_JWKS_URL,
# FENGINE_ACCESS_MODE=invite_only, FENGINE_ALLOWED_USER_IDS=<comma-separated-
# supabase-user-uuids>. Hosted startup fails if either is missing or invalid.
# FENGINE_LOCAL_AUTH must stay unset. Never commit real allowed user IDs. See
# docs/runbooks/hosted-deploy.md.
# Optional trusted imports also require protected FENGINE_IMPORT_TOKEN,
# FENGINE_IMPORT_OWNER_ID, FENGINE_WEB_ORIGIN, and an allowlist in
# FENGINE_IMPORT_MEDIA_ORIGINS when importing existing media.
# Optional user-owned Pexels/FAL credential connections require their BYOK flag,
# FENGINE_CREDENTIAL_ACTIVE_KEY_VERSION=1, and a
# protected FENGINE_CREDENTIAL_KEY_V1 generated with `openssl rand -base64 32`.
# Never configure PEXELS_API_KEY, FAL_KEY, or FAL_API_KEY; hosted startup rejects
# shared keys.

app = "f-motion-api"            # pick a real, unique Fly app name
primary_region = "ams"

[build]
  dockerfile = "apps/api/Dockerfile"

[deploy]
  release_command = "node_modules/.bin/prisma migrate deploy"

[env]
  PORT = "3000"
  FENGINE_ENV = "hosted"
  PGSSLMODE = "verify-full"
  PREVIEW_RENDER_WIDTH = "540"
  PREVIEW_RENDER_HEIGHT = "960"
  RENDER_WIDTH = "720"
  RENDER_HEIGHT = "1280"
  FENGINE_PEXELS_BYOK_ENABLED = "1"
  FENGINE_FAL_BYOK_ENABLED = "0"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    method = "GET"
    path = "/healthz"
    interval = "15s"
    timeout = "5s"
    grace_period = "10s"

  [[http_service.checks]]
    method = "GET"
    path = "/readyz"
    interval = "15s"
    timeout = "5s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
