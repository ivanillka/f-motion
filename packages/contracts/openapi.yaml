openapi: 3.1.0
info:
  title: F-Engine Reference API
  version: 1.0.0
  description: >
    Language-neutral wire contract for the reference host. Production serves
    these operations under `/api` and identical `/v1` aliases. Schema version 1
    remains additive-only.
servers:
  - url: /api
    description: Current production prefix
  - url: /v1
    description: Versioned compatibility alias (same handlers)
paths:
  /healthz:
    get:
      operationId: healthz
      security: []
      responses:
        "200":
          description: Process is alive
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }
  /readyz:
    get:
      operationId: readyz
      security: []
      responses:
        "200":
          description: Dependencies are ready
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReadyStatus" }
        "503":
          description: Dependencies unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReadyStatus" }
  /integrations/project-imports:
    post:
      operationId: importExternalProject
      security: [{ IntegrationToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "200": { $ref: "#/components/responses/ExternalImportResult" }
        "201": { $ref: "#/components/responses/ExternalImportResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "502": { $ref: "#/components/responses/UpstreamError" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /providers/fal/credential:
    get:
      operationId: getFalCredential
      security: [{ BearerAuth: [] }]
      responses:
        "200":
          description: Non-secret FAL credential view
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProviderCredentialView" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/ProviderUnavailable" }
    put:
      operationId: putFalCredential
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [api_key]
              properties:
                api_key: { type: string, minLength: 1 }
              additionalProperties: false
      responses:
        "200":
          description: Connected FAL credential view
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProviderCredentialView" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "503": { $ref: "#/components/responses/ProviderUnavailable" }
    delete:
      operationId: deleteFalCredential
      security: [{ BearerAuth: [] }]
      responses:
        "200":
          description: Disconnected
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProviderCredentialView" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/ProviderUnavailable" }
  /providers/fal/credential/test:
    post:
      operationId: testFalCredential
      security: [{ BearerAuth: [] }]
      responses:
        "200":
          description: Credential validated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProviderCredentialView" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: FAL not connected
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TypedError" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "503": { $ref: "#/components/responses/ProviderUnavailable" }
  /providers/pexels/credential:
    get:
      operationId: getPexelsCredential
      security: [{ BearerAuth: [] }]
      responses:
        "200":
          description: Non-secret Pexels credential view
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProviderCredentialView" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/ProviderUnavailable" }
    put:
      operationId: putPexelsCredential
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [api_key]
              properties:
                api_key: { type: string, minLength: 1 }
              additionalProperties: false
      responses:
        "200":
          description: Connected Pexels credential view
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProviderCredentialView" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "503": { $ref: "#/components/responses/ProviderUnavailable" }
    delete:
      operationId: deletePexelsCredential
      security: [{ BearerAuth: [] }]
      responses:
        "200":
          description: Disconnected
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProviderCredentialView" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/ProviderUnavailable" }
  /providers/pexels/credential/test:
    post:
      operationId: testPexelsCredential
      security: [{ BearerAuth: [] }]
      responses:
        "200":
          description: Credential validated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProviderCredentialView" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: Pexels not connected
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TypedError" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "503": { $ref: "#/components/responses/ProviderUnavailable" }
  /projects:
    get:
      operationId: listProjects
      security: [{ BearerAuth: [] }]
      responses:
        "200":
          description: Owner project summaries
          content:
            application/json:
              schema:
                type: object
                required: [projects]
                properties:
                  projects:
                    type: array
                    items: { $ref: "#/components/schemas/ProjectSummary" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createProject
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateProjectRequest" }
      responses:
        "201":
          description: Created project and concepts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreatedProject" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /projects/{project_id}:
    get:
      operationId: getProject
      security: [{ BearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/ProjectId" }
      responses:
        "200":
          description: Authoritative project snapshot
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectSnapshot" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /projects/{project_id}/commands:
    post:
      operationId: applyCommand
      security: [{ BearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/ProjectId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CommandEnvelope" }
      responses:
        "200":
          description: Authoritative snapshot after command
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectSnapshot" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /projects/{project_id}/media/uploads:
    post:
      operationId: admitUpload
      security: [{ BearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/ProjectId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UploadDeclaration" }
      responses:
        "201":
          description: Admitted upload target
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadAdmission" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /projects/{project_id}/media/{asset_id}/complete:
    post:
      operationId: completeUpload
      security: [{ BearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/ProjectId" }
        - { $ref: "#/components/parameters/AssetId" }
      responses:
        "200":
          description: Asset moved to inspecting
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SceneMediaView" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /projects/{project_id}/media/{asset_id}:
    get:
      operationId: getSceneMedia
      security: [{ BearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/ProjectId" }
        - { $ref: "#/components/parameters/AssetId" }
      responses:
        "200":
          description: Safe media view for a scene asset
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SceneMediaView" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /pexels/search:
    get:
      operationId: searchPexels
      security: [{ BearerAuth: [] }]
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 100 }
      responses:
        "200":
          description: Bounded Pexels search results without source download URLs
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PexelsSearchResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /projects/{project_id}/media/pexels:
    post:
      operationId: copyPexels
      security: [{ BearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/ProjectId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PexelsCopyRequest" }
      responses:
        "201":
          description: Admitted Pexels copy for inspection
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PexelsCopyResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /projects/{project_id}/media/pexels/auto:
    post:
      operationId: autoMatchPexels
      security: [{ BearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/ProjectId" }
      responses:
        "201":
          description: Auto-matched Pexels asset
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PexelsCopyResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /projects/{project_id}/media/pexels/storyboard:
    post:
      operationId: matchStoryboardPexels
      security: [{ BearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/ProjectId" }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                exclude_pexels_ids:
                  type: array
                  items: { type: integer, minimum: 1 }
              additionalProperties: false
      responses:
        "200":
          description: Per-scene match results without attaching media_ids
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StoryboardPexelsResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /projects/{project_id}/render:
    post:
      operationId: enqueueRender
      security: [{ BearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/ProjectId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind]
              properties:
                kind: { type: string, enum: [preview, final] }
              additionalProperties: false
      responses:
        "202":
          description: Queued or coalesced render job
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RenderJobAccepted" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: Invalid kind or incomplete media input
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TypedError" }
        "429":
          description: Owner render capacity reached
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TypedError" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /render-jobs/{job_id}/cancel:
    post:
      operationId: cancelRender
      security: [{ BearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/JobId" }
      responses:
        "200":
          description: Cancellation accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RenderJobState" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /render-jobs/{job_id}/events:
    get:
      operationId: renderEvents
      security: [{ BearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/JobId" }
        - name: Last-Event-ID
          in: header
          schema: { type: string }
      responses:
        "200":
          description: Reconnectable SSE progress stream
          content:
            text/event-stream:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /render-jobs/{job_id}/download:
    get:
      operationId: downloadRender
      security: [{ BearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/JobId" }
      responses:
        "302":
          description: Redirect to a short-lived owner-scoped download URL
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /download/{job_id}:
    get:
      operationId: downloadRenderLegacy
      security: [{ BearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/JobId" }
      responses:
        "302":
          description: Legacy alias of downloadRender
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    IntegrationToken:
      type: http
      scheme: bearer
  parameters:
    ProjectId:
      name: project_id
      in: path
      required: true
      schema: { type: string, minLength: 1 }
    AssetId:
      name: asset_id
      in: path
      required: true
      schema: { type: string, minLength: 1 }
    JobId:
      name: job_id
      in: path
      required: true
      schema: { type: string, minLength: 1 }
  responses:
    Unauthorized:
      description: Missing or invalid credentials
      content:
        application/json:
          schema: { $ref: "#/components/schemas/TypedError" }
    Forbidden:
      description: Account cannot use the API
      content:
        application/json:
          schema: { $ref: "#/components/schemas/TypedError" }
    NotFound:
      description: Resource not found for this owner
      content:
        application/json:
          schema: { $ref: "#/components/schemas/TypedError" }
    ValidationError:
      description: Request failed validation
      content:
        application/json:
          schema: { $ref: "#/components/schemas/TypedError" }
    Conflict:
      description: Stale revision or inadmissible state
      content:
        application/json:
          schema: { $ref: "#/components/schemas/TypedError" }
    Unavailable:
      description: Required dependency is not configured
      content:
        application/json:
          schema: { $ref: "#/components/schemas/TypedError" }
    UpstreamError:
      description: Trusted upstream import failed
      content:
        application/json:
          schema: { $ref: "#/components/schemas/TypedError" }
    ProviderUnavailable:
      description: Provider connection unavailable
      content:
        application/json:
          schema: { $ref: "#/components/schemas/TypedError" }
    ExternalImportResult:
      description: Trusted import result
      content:
        application/json:
          schema:
            type: object
            required: [created, project_id, project_url, revision]
            properties:
              created: { type: boolean }
              project_id: { type: string }
              project_url: { type: string }
              revision: { type: integer, minimum: 0 }
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status: { type: string, const: ok }
    ReadyStatus:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ready, unavailable] }
    TypedError:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum:
            - unauthorized
            - forbidden
            - not_found
            - validation
            - conflict
            - unavailable
            - upstream
            - render_capacity
            - render_input_incomplete
            - provider_unavailable
            - fal_not_connected
            - invalid_provider_credential
            - pexels_not_connected
        message: { type: string }
        current_revision: { type: integer, minimum: 0 }
      additionalProperties: true
    ProviderCredentialView:
      type: object
      required: [connected]
      properties:
        connected: { type: boolean }
        hint: { type: string }
        validated_at: { type: string, format: date-time }
      additionalProperties: false
    ProjectSummary:
      type: object
      required: [id, revision, brief]
      properties:
        id: { type: string }
        revision: { type: integer, minimum: 0 }
        brief: { $ref: "#/components/schemas/Brief" }
    Brief:
      type: object
      required: [purpose, audience, tone]
      properties:
        purpose: { type: string, minLength: 1 }
        audience: { type: string, minLength: 1 }
        tone: { type: string, minLength: 1 }
    CreateProjectRequest:
      type: object
      required: [purpose]
      properties:
        purpose: { type: string, minLength: 1 }
        audience: { type: string }
        tone: { type: string }
    CreatedProject:
      type: object
      required: [project, concepts]
      properties:
        project: { $ref: "#/components/schemas/ProjectSnapshot" }
        concepts:
          type: array
          items: { $ref: "#/components/schemas/Concept" }
    Concept:
      type: object
      required: [id, title, treatment]
      properties:
        id: { type: string }
        title: { type: string }
        treatment: { type: string }
    ProjectSnapshot:
      type: object
      required: [schema_version, id, owner_id, revision, brief, scenes]
      properties:
        schema_version: { type: integer, const: 1 }
        id: { type: string }
        owner_id: { type: string }
        revision: { type: integer, minimum: 0 }
        brief: { $ref: "#/components/schemas/Brief" }
        selected_concept_id: { type: string }
        scenes:
          type: array
          items: { $ref: "#/components/schemas/Scene" }
      additionalProperties: true
    Scene:
      type: object
      required: [id, order, caption, duration_ms, focal_x, focal_y, motion, audio_level, ducking]
      properties:
        id: { type: string, minLength: 1 }
        order: { type: integer, minimum: 0 }
        caption: { type: string, maxLength: 180 }
        duration_ms: { type: number, minimum: 500, maximum: 15000 }
        focal_x: { type: number, minimum: 0, maximum: 1 }
        focal_y: { type: number, minimum: 0, maximum: 1 }
        motion: { type: string, enum: [none, push, zoom] }
        audio_level: { type: number, minimum: 0, maximum: 1 }
        ducking: { type: boolean }
        media_id: { type: string, minLength: 1 }
        visual_prompt:
          type: string
          minLength: 1
          maxLength: 240
        caption_cues:
          type: array
          items: { $ref: "#/components/schemas/CaptionCue" }
      additionalProperties: true
    CaptionCue:
      type: object
      required: [text, start_ms, end_ms]
      properties:
        text: { type: string }
        start_ms: { type: number, minimum: 0 }
        end_ms: { type: number, minimum: 0 }
    CommandEnvelope:
      type: object
      required: [command_id, base_revision, client_timestamp, kind, payload]
      properties:
        command_id: { type: string, minLength: 1 }
        project_id: { type: string }
        base_revision: { type: integer, minimum: 0 }
        client_timestamp: { type: string }
        kind:
          type: string
          enum: [select_concept, update_scene, reorder_scene, replace_storyboard, add_scene, remove_scene, update_soundtrack]
        payload:
          oneOf:
            - $ref: "#/components/schemas/SelectConceptPayload"
            - $ref: "#/components/schemas/UpdateScenePayload"
            - $ref: "#/components/schemas/ReorderScenePayload"
            - $ref: "#/components/schemas/ReplaceStoryboardPayload"
            - $ref: "#/components/schemas/AddScenePayload"
            - $ref: "#/components/schemas/RemoveScenePayload"
            - $ref: "#/components/schemas/UpdateSoundtrackPayload"
    SelectConceptPayload:
      type: object
      required: [concept_id]
      properties:
        concept_id: { type: string, minLength: 1 }
    UpdateScenePayload:
      type: object
      required: [scene]
      properties:
        scene: { $ref: "#/components/schemas/Scene" }
    ReorderScenePayload:
      type: object
      required: [scene_id, to]
      properties:
        scene_id: { type: string, minLength: 1 }
        to: { type: integer, minimum: 0 }
    ReplaceStoryboardPayload:
      type: object
      required: [scenes]
      properties:
        scenes:
          type: array
          minItems: 1
          maxItems: 8
